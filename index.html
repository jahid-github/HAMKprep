o)", "kirjastossa"], ["Tulen ___. (koulu)", "koulusta"], ["Minulla on kaksi ___. (kirja)", "kirjaa"], ["Minulla ei ole ___. (auto)", "autoa"], ["Juon ___. (kahvi)", "kahvia"], ["Pidän ___. (musiikki)", "musiikista"], ["Menen kouluun ___. (bussi)", "bussilla"], ["Ask: Where do you live?", "Missä asut?"], ["Ask: Why are you studying Finnish?", "Miksi opiskelet suomea?"], ["Ask politely: Could you repeat?", "Voisitko toistaa?"], ["Ask: How much does this cost?", "Kuinka paljon tämä maksaa?"], ["Correct: Minä ei puhu suomea.", "Minä en puhu suomea."], ["Correct: Minä olen kaksi lasta.", "Minulla on kaksi lasta."], ["Correct: Menen kaupassa.", "Menen kauppaan."], ["Correct: Minä pidän kahvi.", "Minä pidän kahvista."], ["Correct: Eilen menen kouluun.", "Eilen menin kouluun."], ["Correct: Minä täytyy opiskella.", "Minun täytyy opiskella."], ["I cannot come today because I am ill.", "En voi tulla tänään, koska olen sairas."], ["Can we meet tomorrow at five?", "Voimmeko tavata huomenna kello viisi?"], ["I would like to book an appointment.", "Haluaisin varata ajan."], ["I went to the library yesterday.", "Kävin eilen kirjastossa."], ["I have studied Finnish for one year.", "Olen opiskellut suomea vuoden."], ["I like this course because it is useful.", "Pidän tästä kurssista, koska se on hyödyllinen."], ["I am looking for a training placement.", "Etsin harjoittelupaikkaa."], ["The washing machine does not work.", "Pesukone ei toimi."], ["Please speak a little more slowly.", "Voisitko puhua vähän hitaammin?"], ["I will submit the assignment on Friday.", "Palautan tehtävän perjantaina."]], "grammar_topics": [["Present tense", "Minä opiskelen. Hän opiskelee. Me opiskelemme.", "Verb endings change with person: minä -n, hän often doubles final vowel, me -mme.", "Opiskelen suomea joka päivä.", "I study Finnish every day."], ["Negative verbs", "En puhu. Et puhu. Hän ei puhu. Me emme puhu.", "The negative verb conjugates; the main verb follows in its stem form.", "Minä en ymmärrä kysymystä.", "I do not understand the question."], ["Have / possess", "Minulla on auto. Minulla ei ole autoa.", "Finnish uses minulla on, not minä olen.", "Minulla on uusi tietokone.", "I have a new computer."], ["Where / from / to", "kaupassa / kaupasta / kauppaan; kirjastossa / kirjastosta / kirjastoon.", "Inside location -ssa/-stä/-Vn; some forms change their stem.", "Menen kirjastoon. Olen kirjastossa.", "I go to the library. I am at the library."], ["Partitive", "kaksi kirjaa; juon kahvia; en osta autoa.", "Commonly used with numbers above one, incomplete amounts and negation.", "Minulla on kaksi kirjaa.", "I have two books."], ["Past tense", "menen → menin; käyn → kävin; syön → söin.", "Use past tense for yesterday / last week, negative past uses en + participle.", "Eilen kävin kaupassa.", "Yesterday I went shopping."], ["Time and half-hour", "puoli kuusi = 17.30; puoli yhdeksän = 8.30.", "Puoli points to the NEXT hour, not the previous one.", "Tavataan puoli kuusi.", "Let us meet at 5:30."], ["Polite conditional", "Voisitko auttaa? Haluaisin varata ajan.", "Safe polite requests for service situations.", "Voisitko puhua vähän hitaammin?", "Could you speak a bit more slowly?"], ["Must / need not", "Minun täytyy opiskella. Minun ei tarvitse mennä.", "Do not mix up must not and do not need to.", "Minun täytyy palauttaa tehtävä.", "I must submit the assignment."], ["I like / am interested", "Pidän musiikista. Olen kiinnostunut tietotekniikasta.", "pitää + -sta/-stä, rakastaa + partitive.", "Pidän tästä kurssista.", "I like this course."], ["Present for future", "Huomenna menen kouluun. Ensi viikolla tapaan ystävän.", "Finnish generally uses present tense plus future time expression.", "Huomenna opiskelen kotona.", "Tomorrow I will study at home."], ["Conjunctions", "ja, mutta, koska, jos, siksi, sitten, sen jälkeen.", "Connect your sentences; koska introduces reasons.", "En tule, koska olen sairas.", "I am not coming because I am ill."]], "scripts": {"1": "Hei! Soitan hammashoitolasta. Sinulla oli aika tiistaina kello yhdeksän, mutta meidän täytyy siirtää sitä. Uusi aika on keskiviikkona kello puoli kymmenen. Vastaanotto on samassa paikassa kuin ennen. Jos uusi aika ei sovi sinulle, soita meille tänään ennen kello neljää. Kiitos!", "2": "Huomio matkustajat. Juna Tampereelle on noin viisitoista minuuttia myöhässä. Juna lähtee tänään laiturilta neljä, ei laiturilta kaksi. Pahoittelemme viivästystä. Tarkista junan uusi lähtöaika aseman näytöltä.", "3": "Moi! Voitko käydä kaupassa kotimatkalla? Tarvitsemme leipää ja kananmunia. Maitoa ei tarvitse ostaa, sitä on vielä jääkaapissa. Minä tulen kotiin noin kuudelta. Teen sitten meille ruokaa. Nähdään illalla!", "4": "Hyvää huomenta! Suomen tunti on tänään kirjaston toisessa kerroksessa. Tavallisessa luokassa tehdään remonttia. Tunti alkaa kymmeneltä kuten aina. Ota mukaan vihko ja kynä. Oppikirjaa ei tänään tarvita, koska opettaja antaa teille tekstit.", "5": "Hei Sami! Ajattelin, että voisimme mennä lauantaina museoon. Sääennusteen mukaan silloin sataa, joten puisto ei ehkä ole hyvä idea. Museo avautuu kahdeltatoista. Tavataanko sen ovella puoli yksi? Liput maksavat opiskelijoille viisi euroa. Ota opiskelijakortti mukaan.", "6": "Minä olen Aino. Olen töissä pienessä kahvilassa. Työpäiväni alkaa aamulla kahdeksalta ja loppuu iltapäivällä kolmelta. Tiistaisin ja torstaisin menen työn jälkeen suomen kurssille. Haluan oppia suomea, koska haluan puhua paremmin asiakkaiden kanssa. Viikonloppuna lepään ja tapaan ystäviä.", "7": "Hei! Ostin tämän paidan eilen, mutta se on liian pieni. Väri on hyvä, ja pidän tästä mallista. Haluaisin vaihtaa sen suurempaan kokoon. Minulla on kuitti mukana. Onko teillä samaa paitaa koossa L?", "8": "Huomenna aamulla on aurinkoista ja melko viileää. Lämpötila on noin kahdeksan astetta. Iltapäivällä sää lämpenee, ja lämpötila nousee neljääntoista asteeseen. Sade alkaa vasta illalla. Jos lähdet illaksi ulos, ota sateenvarjo mukaan.", "9": "Moi! Mä oon vähän myöhässä, koska bussi ei tullut ajoissa. Mä oon siellä noin kymmenen minuutin päästä. Sun ei tarvitse odottaa ulkona. Mene vaan sisälle kahvilaan ja ota pöytä. Mä tuun sinne heti, kun pääsen.", "10": "Tervetuloa opiskelijapalveluihin. Toimistomme on avoinna maanantaisin, keskiviikkoisin ja perjantaisin kello kymmenestä kahteen. Voit tulla ilman ajanvarausta. Muina päivinä voit lähettää meille sähköpostia. Vastaamme viesteihin yleensä kahden arkipäivän kuluessa.", "11": "Hei, tässä on huoltomies. Tulen huomenna torstaina aamulla kahdeksan ja yhdeksän välillä korjaamaan keittiön hanaa. Työ kestää noin puoli tuntia. Jos et ole silloin kotona, soita minulle, niin sovimme toisen ajan. Kiitos ja huomiseen.", "12": "Meidän piti mennä tänään uimaan, mutta uimahalli on kiinni. Ajattelimme ensin mennä elokuviin. Liput olivat kuitenkin liian kalliita. Päätimme lopulta mennä ystävän kotiin ja tehdä ruokaa yhdessä. Menemme uimaan ensi viikolla.", "A1": "Hei, tässä on Laura kampaamosta. Sinulla on aika hiustenleikkaukseen perjantaina kello kaksi. Valitettavasti olen silloin poissa. Voisitko tulla jo torstaina kello puoli neljä? Hiustenleikkaus kestää noin neljäkymmentä minuuttia. Jos torstai ei sovi, lähetä meille viesti, niin etsimme toisen ajan. Kiitos!", "A2": "Olen töissä ruokakaupassa. Työ alkaa yleensä kello kuusi aamulla. Kesällä menen töihin pyörällä, mutta talvella käytän bussia. Keskiviikkoiltaisin käyn suomen kurssilla. Kurssi loppuu kahdeksalta. Pidän kurssista, koska harjoittelemme paljon tavallisia keskusteluja. Voin käyttää uusia sanoja heti työssä.", "B1": "Hei! Tässä on viesti opiskelijapalveluista. Huomenna torstaina toimisto on avoinna vain kello yhdeksästä yhteentoista. Suljemme aikaisin henkilökunnan kokouksen vuoksi. Sähköpostia voi lähettää normaalisti koko päivän. Perjantaina toimisto on taas avoinna kello yhdeksästä kolmeen. Kiitos ymmärryksestä.", "B2": "Hei, tässä on Jari kirjastosta. Löysimme repun lukusalista ikkunan vierestä. Reppu on tummansininen. Sen sisällä on vihko ja punainen pipo. Jos reppu on sinun, voit hakea sen tänään asiakaspalvelusta kello kahdentoista ja kuuden välillä. Ota henkilöllisyystodistus mukaan."}, "mocks": [{"id": "A", "title": "Mock Exam A", "readingTexts": [{"name": "A1 • Opiskelijoiden retki", "text": "Lähdemme perjantaina luontoretkelle. Bussi lähtee koulun pääovelta kello 8.45. Ole paikalla viimeistään 8.30. Ota mukaan eväät, vesipullo ja hyvät kengät. Retki on maksuton. Palaamme koululle noin kello 15. Ilmoita osallistumisesta opettajalle keskiviikkoon mennessä. Retki järjestetään myös sateella.", "questionStart": 0, "questionEnd": 5}, {"name": "A2 • Uusi asunto", "text": "Hei! Löysin uuden asunnon. Se on pienempi kuin vanha, mutta vuokra on sata euroa halvempi. Muutan ensi lauantaina. Siskoni tulee auttamaan aamulla, mutta tarvitsemme vielä yhden ihmisen kantamaan sohvaa. Voisitko tulla kello yksitoista? Tarjoan muuton jälkeen ruokaa. Terveisin Eero", "questionStart": 5, "questionEnd": 10}], "reading": [{"t": "Mihin aikaan opiskelijan pitää viimeistään olla paikalla?", "type": "open", "options": [], "answer": "8.30", "aliases": ["kello 8.30"], "explain": ""}, {"t": "Mistä bussi lähtee?", "type": "open", "options": [], "answer": "Koulun pääovelta", "aliases": [], "explain": ""}, {"t": "Mitä pitää ottaa mukaan? Mainitse kolme asiaa.", "type": "open", "options": [], "answer": "Eväät, vesipullo ja hyvät kengät", "aliases": [], "explain": ""}, {"t": "Retki perutaan, jos sataa.", "type": "tf", "options": [], "answer": "Väärin", "aliases": [], "explain": ""}, {"t": "Mihin mennessä pitää ilmoittautua?", "type": "open", "options": [], "answer": "Keskiviikkoon mennessä", "aliases": ["keskiviikkona"], "explain": ""}, {"t": "Onko uusi asunto suurempi kuin vanha?", "type": "open", "options": [], "answer": "Ei", "aliases": [], "explain": ""}, {"t": "Mikä uudessa asunnossa on edullisempaa?", "type": "open", "options": [], "answer": "Vuokra, sata euroa halvempi", "aliases": ["vuokra"], "explain": ""}, {"t": "Milloin Eero muuttaa?", "type": "open", "options": [], "answer": "Ensi lauantaina", "aliases": [], "explain": ""}, {"t": "Mihin Eero tarvitsee apua?", "type": "open", "options": [], "answer": "Sohvan kantamiseen", "aliases": ["kantamaan sohvaa"], "explain": ""}, {"t": "Mitä Eero tarjoaa avun jälkeen?", "type": "open", "options": [], "answer": "Ruokaa", "aliases": [], "explain": ""}], "listening": [{"t": "Kuka soittaa?", "type": "open", "options": [], "answer": "Laura kampaamosta", "aliases": ["laura"], "explain": ""}, {"t": "Mikä alkuperäinen päivä oli?", "type": "open", "options": [], "answer": "Perjantai", "aliases": [], "explain": ""}, {"t": "Mikä uusi päivä on?", "type": "open", "options": [], "answer": "Torstai", "aliases": [], "explain": ""}, {"t": "Mihin aikaan uusi aika on?", "type": "open", "options": [], "answer": "15.30", "aliases": ["puoli neljä"], "explain": ""}, {"t": "Mitä pitää tehdä, jos aika ei sovi?", "type": "open", "options": [], "answer": "Lähettää viesti", "aliases": ["lähetä viesti"], "explain": ""}, {"t": "Missä puhuja työskentelee?", "type": "open", "options": [], "answer": "Ruokakaupassa", "aliases": [], "explain": ""}, {"t": "Mihin aikaan hänen työnsä alkaa?", "type": "open", "options": [], "answer": "Kello 6", "aliases": ["kuudelta"], "explain": ""}, {"t": "Miten hän menee töihin talvella?", "type": "open", "options": [], "answer": "Bussilla", "aliases": [], "explain": ""}, {"t": "Mitä hän tekee keskiviikkoiltaisin?", "type": "open", "options": [], "answer": "Käy suomen kurssilla", "aliases": ["suomen kurssilla"], "explain": ""}, {"t": "Miksi hän pitää kurssista?", "type": "open", "options": [], "answer": "He harjoittelevat tavallisia keskusteluja", "aliases": ["tavallisia keskusteluja"], "explain": ""}], "listenSections": [{"name": "A-L1 • Kampaamon viesti", "script": "Hei, tässä on Laura kampaamosta. Sinulla on aika hiustenleikkaukseen perjantaina kello kaksi. Valitettavasti olen silloin poissa. Voisitko tulla jo torstaina kello puoli neljä? Hiustenleikkaus kestää noin neljäkymmentä minuuttia. Jos torstai ei sovi, lähetä meille viesti, niin etsimme toisen ajan. Kiitos!", "start": 0, "end": 5}, {"name": "A-L2 • Työ ja suomen kurssi", "script": "Olen töissä ruokakaupassa. Työ alkaa yleensä kello kuusi aamulla. Kesällä menen töihin pyörällä, mutta talvella käytän bussia. Keskiviikkoiltaisin käyn suomen kurssilla. Kurssi loppuu kahdeksalta. Pidän kurssista, koska harjoittelemme paljon tavallisia keskusteluja. Voin käyttää uusia sanoja heti työssä.", "start": 5, "end": 10}], "writing": [{"prompt": "Kirjoita ystävälle. Olet myöhässä tapaamisesta. Kerro syy, uusi saapumisaika ja missä ystävä voi odottaa. Pyydä anteeksi.", "model": "Moi Sami! Anteeksi, olen myöhässä. Bussini jäi ruuhkaan, joten en ehdi paikalle kello viisi. Tulen noin kello puoli kuusi. Voit odottaa minua kirjaston sisällä. Lähetän viestin, kun olen lähellä. Nähdään pian!"}, {"prompt": "Kirjoita palaute suomen kurssista. Kerro kaksi hyvää asiaa ja yksi vaikea asia. Ehdota parannusta.", "model": "Pidän suomen kurssista, koska opettaja selittää asiat selkeästi ja saamme puhua pareittain. Kuuntelutehtävät ovat joskus vaikeita, sillä ihmiset puhuvat nopeasti. Toivon, että voimme kuunnella tehtävät uudelleen ja harjoitella lisää arkisia keskusteluja."}], "speaking": [{"prompt": "Kerro tavallisesta opiskelupäivästäsi. Mitä teet aamulla, päivällä ja illalla?", "model": "Herään seitsemältä ja syön aamupalaa. Menen kouluun bussilla. Iltapäivällä teen ryhmätöitä. Illalla teen kotitehtävät ja lepään."}, {"prompt": "Olet kaupassa. Kysy takin kokoa ja hintaa. Kerro, että haluat sovittaa takkia.", "model": "Hei! Onko tätä takkia koossa M? Kuinka paljon se maksaa? Haluaisin sovittaa sitä."}, {"prompt": "Kerro viime viikonlopusta. Missä olit, kenen kanssa ja mitä teit?", "model": "Viime viikonloppuna olin kotona ja tapasin ystävän. Kävimme kahvilassa. Sunnuntaina opiskelin suomea."}, {"prompt": "Pidätkö enemmän opiskelusta kotona vai koulussa? Anna kaksi syytä.", "model": "Pidän opiskelusta koulussa, koska siellä voin kysyä apua ja tehdä ryhmätöitä."}]}, {"id": "B", "title": "Mock Exam B", "readingTexts": [{"name": "B1 • Harrastustapahtuma", "text": "Liikuntapäivä järjestetään lauantaina kello 10–14 urheilukentällä. Voit kokeilla erilaisia liikuntalajeja maksutta. Uinti ei kuulu ohjelmaan. Alle 12-vuotiaat osallistuvat aikuisen kanssa. Paikalla on kahvio, jossa voi maksaa vain kortilla. Jos sataa kovasti, tapahtuma siirtyy koulun liikuntasaliin. Ilmoittautumista ei tarvita.", "questionStart": 0, "questionEnd": 5}, {"name": "B2 • Viesti ryhmälle", "text": "Hei ryhmä! Emme tapaa huomenna kampuksella. Teemme projektia verkossa kello 13–15, koska yksi ryhmän jäsen on toisessa kaupungissa. Lue ohjeet ennen tapaamista. Lähetän kokouslinkin aamulla sähköpostilla. Jos linkki ei toimi, soita minulle. Tehtävän palautuspäivä ei muutu: se on edelleen perjantai.", "questionStart": 5, "questionEnd": 10}], "reading": [{"t": "Kuinka kauan tapahtuma kestää?", "type": "open", "options": [], "answer": "Neljä tuntia", "aliases": ["4 tuntia"], "explain": ""}, {"t": "Voiko tapahtumassa uida?", "type": "open", "options": [], "answer": "Ei", "aliases": [], "explain": ""}, {"t": "Voiko 10-vuotias osallistua yksin?", "type": "open", "options": [], "answer": "Ei", "aliases": [], "explain": ""}, {"t": "Miten kahviossa maksetaan?", "type": "open", "options": [], "answer": "Vain kortilla", "aliases": ["kortilla"], "explain": ""}, {"t": "Missä tapahtuma on kovalla sateella?", "type": "open", "options": [], "answer": "Koulun liikuntasalissa", "aliases": ["liikuntasalissa"], "explain": ""}, {"t": "Missä ryhmä työskentelee huomenna?", "type": "open", "options": [], "answer": "Verkossa", "aliases": [], "explain": ""}, {"t": "Miksi tapaamispaikka muuttuu?", "type": "open", "options": [], "answer": "Yksi jäsen on toisessa kaupungissa", "aliases": ["toisessa kaupungissa"], "explain": ""}, {"t": "Mitä pitää tehdä ennen tapaamista?", "type": "open", "options": [], "answer": "Lukea ohjeet", "aliases": ["lue ohjeet"], "explain": ""}, {"t": "Mitä pitää tehdä, jos linkki ei toimi?", "type": "open", "options": [], "answer": "Soittaa", "aliases": ["soita minulle"], "explain": ""}, {"t": "Mikä on palautuspäivä?", "type": "open", "options": [], "answer": "Perjantai", "aliases": [], "explain": ""}], "listening": [{"t": "Mistä toimisto ilmoittaa?", "type": "open", "options": [], "answer": "Muuttuneista aukioloajoista", "aliases": ["aukioloajoista"], "explain": ""}, {"t": "Mitkä aukioloajat ovat huomenna?", "type": "open", "options": [], "answer": "9–11", "aliases": ["kello yhdeksästä yhteentoista"], "explain": ""}, {"t": "Miksi toimisto sulkeutuu aikaisin?", "type": "open", "options": [], "answer": "Henkilökunnan kokouksen vuoksi", "aliases": ["kokouksen vuoksi"], "explain": ""}, {"t": "Voiko sähköpostia lähettää iltapäivällä?", "type": "open", "options": [], "answer": "Kyllä", "aliases": [], "explain": ""}, {"t": "Milloin toimisto aukeaa seuraavan kerran?", "type": "open", "options": [], "answer": "Perjantaina kello 9", "aliases": ["perjantaina"], "explain": ""}, {"t": "Mikä on löytynyt?", "type": "open", "options": [], "answer": "Reppu", "aliases": [], "explain": ""}, {"t": "Mistä se löytyi?", "type": "open", "options": [], "answer": "Kirjaston lukusalista ikkunan vierestä", "aliases": ["lukusalista"], "explain": ""}, {"t": "Minkä värinen se on?", "type": "open", "options": [], "answer": "Tummansininen", "aliases": [], "explain": ""}, {"t": "Mitä sen sisällä on? Mainitse kaksi asiaa.", "type": "open", "options": [], "answer": "Vihko ja punainen pipo", "aliases": [], "explain": ""}, {"t": "Mihin aikaan sen voi noutaa tänään?", "type": "open", "options": [], "answer": "Kello 12–18", "aliases": ["12-18"], "explain": ""}], "listenSections": [{"name": "B-L1 • Palvelutoimisto", "script": "Hei! Tässä on viesti opiskelijapalveluista. Huomenna torstaina toimisto on avoinna vain kello yhdeksästä yhteentoista. Suljemme aikaisin henkilökunnan kokouksen vuoksi. Sähköpostia voi lähettää normaalisti koko päivän. Perjantaina toimisto on taas avoinna kello yhdeksästä kolmeen. Kiitos ymmärryksestä.", "start": 0, "end": 5}, {"name": "B-L2 • Löytötavara", "script": "Hei, tässä on Jari kirjastosta. Löysimme repun lukusalista ikkunan vierestä. Reppu on tummansininen. Sen sisällä on vihko ja punainen pipo. Jos reppu on sinun, voit hakea sen tänään asiakaspalvelusta kello kahdentoista ja kuuden välillä. Ota henkilöllisyystodistus mukaan.", "start": 5, "end": 10}], "writing": [{"prompt": "Kirjoita naapurille. Pyydä apua kukkien kastelussa matkan aikana. Kerro milloin olet poissa, mitä pyydät ja miten naapuri saa avaimen.", "model": "Moi! Olen matkalla perjantaista maanantaihin. Voisitko kastella kukkani lauantaina? Voin tuoda avaimen sinulle torstaina. Kiitos paljon avusta!"}, {"prompt": "Kerro uudelle opiskelijalle opinnoistasi. Mikä on helppoa ja mikä vaikeaa? Anna kaksi vinkkiä.", "model": "Opiskelen tietotekniikkaa HAMKissa. Teemme paljon ryhmätöitä. Tietokoneen käyttäminen on helppoa, mutta pitkät ohjeet ovat joskus vaikeita. Kysy rohkeasti apua ja tee itsellesi viikkosuunnitelma."}], "speaking": [{"prompt": "Kuvaile kotiasi ja asuinaluettasi. Kerro yksi hyvä ja yksi huono asia.", "model": "Asun pienessä kerrostaloasunnossa. Lähellä on kauppa ja kirjasto. Hyvä puoli on rauhallinen alue. Huono puoli on kallis vuokra."}, {"prompt": "Soita kirjastoon. Kysy tulostamisesta ja hinnasta.", "model": "Hei! Voinko tulostaa kirjastossa? Kuinka paljon tulostaminen maksaa? Tarvitsenko kirjastokortin?"}, {"prompt": "Kerro ensi viikon suunnitelmista. Mainitse opiskelu, vapaa-aika ja tapaaminen.", "model": "Ensi viikolla opiskelen joka päivä. Keskiviikkona tapaan ystävän. Viikonloppuna kävelen puistossa."}, {"prompt": "Onko kävely hyvä harrastus? Kerro mielipiteesi ja kaksi syytä.", "model": "Kyllä, kävely on hyvä harrastus. Se ei maksa mitään, ja se auttaa rentoutumaan."}]}], "source_note": "Study Pack (15 Sept 2026), 02_reading.pdf (17 Sept 2026), YKI examples and HAMK public rules (accessed 11 Oct 2026)."}</script><script>
const DB=JSON.parse(document.getElementById("dataset").textContent);

const sections={reading:'Reading',listening:'Listening',writing:'Writing',speaking:'Speaking',grammar:'Grammar',vocabulary:'Vocabulary',mocks:'Practice tests'};
let section='reading',index=0,vocabGroup='',query='',flipped=false,mockPart='reading',drafts={};
try{drafts=JSON.parse(localStorage.getItem('hamk-simple-drafts')||'{}')}catch(e){}
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(el){drafts[el.dataset.key]=el.value;try{localStorage.setItem('hamk-simple-drafts',JSON.stringify(drafts))}catch(e){}}
function field(key,long=false){return long?`<textarea aria-label="Your Finnish response" data-key="${e(key)}" oninput="save(this)" placeholder="Write in Finnish…">${e(drafts[key]||'')}</textarea>`:`<input type="text" aria-label="Your answer" data-key="${e(key)}" oninput="save(this)" value="${e(drafts[key]||'')}" placeholder="Your answer">`}
function reveal(title,content){return `<details><summary>${title}</summary><div class="answer">${content}</div></details>`}
function passage(t){return `<div class="passage" lang="fi">${e(t)}</div>`}
function questions(qs,prefix){return qs.map((q,i)=>{const key=prefix+i;let options=q.type==='mc'?q.options:q.type==='tf'?['Oikein','Väärin']:null;let ans=q.answer;if(q.type==='mc'&&/^[A-Z]$/.test(ans))ans=ans+'. '+q.options[ans.charCodeAt(0)-65];if(ans==='O')ans='Oikein';if(ans==='V')ans='Väärin';return `<section class="question"><h3 lang="fi">${i+1}. ${e(q.t)}</h3>${options?options.map((o,j)=>`<label class="choice"><input type="radio" name="${e(key)}" data-key="${e(key)}" value="${j}" onchange="save(this)" ${String(drafts[key])===String(j)?'checked':''}><span>${q.type==='mc'?String.fromCharCode(65+j)+'. ':''}${e(o)}</span></label>`).join(''):field(key)}${reveal('Show answer',`<strong lang="fi">${e(ans)}</strong>${q.explain?'\n\n'+e(q.explain):''}`)}</section>`}).join('')}
let speechText='';
function stopAudio(){if('speechSynthesis'in window)speechSynthesis.cancel()}
function listen(){stopAudio();const status=document.getElementById('audioStatus');if(!('speechSynthesis'in window)){status.textContent='Speech is unavailable in this viewer. Use the transcript below.';return}const voices=speechSynthesis.getVoices(),voice=voices.find(v=>/^fi/i.test(v.lang));if(!voice){status.textContent='No Finnish voice is available. Enable a Finnish voice on your device, or read the transcript.';return}const u=new SpeechSynthesisUtterance(speechText);u.lang='fi-FI';u.voice=voice;u.rate=.85;u.onerror=()=>status.textContent='Audio could not play. Use the transcript below.';speechSynthesis.speak(u);status.textContent='Finnish device voice · slow speed'}
function audio(t){speechText=t;return `<div class="actions"><button onclick="listen()">Listen</button><button onclick="stopAudio()">Stop</button></div><p class="status" id="audioStatus" role="status"></p>`}
function go(s){stopAudio();section=s;index=0;mockPart='reading';render();window.scrollTo(0,0)}
function pick(n){stopAudio();index=Number(n);flipped=false;render();window.scrollTo(0,0)}
function pager(n){return `<div class="pager"><button onclick="pick(${index-1})" ${index===0?'disabled':''}>← Previous</button><span class="muted">${index+1} / ${n}</span><button onclick="pick(${index+1})" ${index===n-1?'disabled':''}>Next →</button></div>`}
function select(items){return `<label class="muted" for="lesson">Choose a lesson</label><select id="lesson" onchange="pick(this.value)">${items.map((x,i)=>`<option value="${i}" ${index===i?'selected':''}>${i+1}. ${e(x.title||x[0])}</option>`).join('')}</select>`}
function productive(x,key,speaking=false){return passage(x.task||x.prompt)+(speaking?audio(x.prompt)+`<p class="muted">Answer aloud, then compare with the model.</p>`:field(key,true))+reveal('Show model answer',`<span lang="fi">${e(x.model)}</span>${x.meaning?'\n\n<strong>English</strong>\n'+e(x.meaning):''}${x.followups?'\n\n<strong>Follow-up practice</strong>\n'+e(x.followups):''}${x.check?'\n\n<strong>Check your answer</strong>\n'+e(x.check):''}`)}
function vocab(){let list=DB.vocabulary.filter(v=>(!vocabGroup||v.group===vocabGroup)&&(!query||(v.fi+' '+v.en).toLowerCase().includes(query.toLowerCase())));if(index>=list.length)index=0;let x=list[index];speechText=x?.fi||'';return `<label class="muted" for="topic">Topic</label><select id="topic" onchange="vocabGroup=this.value;index=0;flipped=false;render()"><option value="">All words</option>${[...new Set(DB.vocabulary.map(v=>v.group))].map(g=>`<option ${g===vocabGroup?'selected':''}>${e(g)}</option>`).join('')}</select><label class="muted" for="search" style="margin-top:14px">Search Finnish or English</label><input id="search" type="search" value="${e(query)}" placeholder="Find a word" onchange="query=this.value;index=0;flipped=false;render()">${x?`<button class="cardface" onclick="flipped=!flipped;render()" aria-label="${flipped?'Hide':'Show'} translation"><small>${e(x.group)}</small><b lang="fi">${e(x.fi)}</b><span>${flipped?e(x.en):'Tap to show English'}</span></button>${audio(x.fi)}${pager(list.length)}`:'<p>No matching words.</p>'}`}
function mock(m){let names={reading:'Reading',listening:'Listening',writing:'Writing',speaking:'Speaking'};let html=`<p class="muted">Practice material, not an official exam. Compare your answers with the models.</p><div class="actions">${Object.entries(names).map(([k,v])=>`<button class="${k===mockPart?'active':''}" onclick="mockPart='${k}';stopAudio();render()">${v}</button>`).join('')}</div>`;
if(mockPart==='reading')html+=m.readingTexts.map((b,i)=>`<h3>${e(b.name)}</h3>${passage(b.text)}${questions(m.reading.slice(b.questionStart,b.questionEnd),m.id+'read'+i)}`).join('');
if(mockPart==='listening'){html+=m.listenSections.map((b,i)=>`<h3>${e(b.name)}</h3><div class="actions"><button onclick="speechText=DB.mocks[index].listenSections[${i}].script;listen()">Listen</button><button onclick="stopAudio()">Stop</button></div>${reveal('Show transcript',e(b.script))}${questions(m.listening.slice(b.start,b.end),m.id+'listen'+i)}`).join('')+'<p id="audioStatus" role="status" class="status"></p>'}
if(mockPart==='writing'||mockPart==='speaking')html+=m[mockPart].map((x,i)=>`<h3>Task ${i+1}</h3>${passage(x.prompt)}${mockPart==='writing'?field(m.id+'write'+i,true):'<p class="muted">Answer aloud before revealing the model.</p>'}${reveal('Show model answer',e(x.model))}`).join('');return html}
function render(){document.getElementById('nav').innerHTML=Object.entries(sections).map(([k,v])=>`<button class="${section===k?'active':''}" ${section===k?'aria-current="page"':''} onclick="go('${k}')">${v}</button>`).join('');let html='';
if(section==='vocabulary')html='<h2>Vocabulary</h2>'+vocab();
else if(section==='grammar'){const all=[...DB.grammar_topics,...DB.grammar.map((x,i)=>['Exercise '+(i+1),...x])];html=select(all);if(index<DB.grammar_topics.length){const x=DB.grammar_topics[index];html+=`<h2>${e(x[0])}</h2>${passage(x[1])}<p>${e(x[2])}</p>${passage(x[3])}<p>${e(x[4])}</p>${audio(x[3])}`}else{const x=DB.grammar[index-DB.grammar_topics.length];html+=`<h2>Grammar exercise ${index-DB.grammar_topics.length+1}</h2>${questions([{t:x[0],answer:x[1],type:'open'}],'grammar'+index)}`}html+=pager(all.length)}
else{const items=DB[section],x=items[index];html=select(items)+`<h2>${e(x.title)}</h2>`;
if(section==='reading')html+=passage(x.text)+questions(x.questions,x.id);
if(section==='listening')html+=audio(x.script)+reveal('Show transcript',e(x.script))+questions(x.questions,x.id);
if(section==='writing'||section==='speaking')html+=productive(x,x.id,section==='speaking');
if(section==='mocks')html+=mock(x);
html+=pager(items.length)}
document.getElementById('main').innerHTML=html}
window.addEventListener('pagehide',stopAudio);render();
</script></body></html>
