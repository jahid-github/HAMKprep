      "model": "Pidän riisistä, kanasta ja vihanneksista. Teen usein ruokaa kotona, koska se on halvempi vaihtoehto. Syön aamulla leipää ja kananmunan. Päivällä syön lounasta koulussa. Illalla teen lämpimän ruoan. Viikonloppuna kokeilen joskus uutta reseptiä. Minusta yhdessä syöminen on mukavaa.",

    },

  "grammar_topics": [
    [
      "Present tense",
      "Minä opiskelen. Hän opiskelee. Me opiskelemme.",
      "Verb endings change with person: minä -n, hän often doubles final vowel, me -mme.",
      "Opiskelen suomea joka päivä.",
      "I study Finnish every day."
    ],
    [
      "Negative verbs",
      "En puhu. Et puhu. Hän ei puhu. Me emme puhu.",
      "The negative verb conjugates; the main verb follows in its stem form.",
      "Minä en ymmärrä kysymystä.",
      "I do not understand the question."
    ],
    [
      "Have / possess",
      "Minulla on auto. Minulla ei ole autoa.",
      "Finnish uses minulla on, not minä olen.",

      "I have a new computer."
    ],
    [
      "Where / from / to",
      "kaupassa / kaupasta / kauppaan; kirjastossa / kirjastosta / kirjastoon.",

  "scripts": {
    "1": "Hei! Soitan hammashoitolasta. Sinulla oli aika tiistaina kello yhdeksän, mutta meidän täytyy siirtää sitä. Uusi aika on keskiviikkona kello puoli kymmenen. Vastaanotto on samassa paikassa kuin ennen. Jos uusi aika ei sovi sinulle, soita meille tänään ennen kello neljää. Kiitos!",
    "2": "Huomio matkustajat. Juna Tampereelle on noin viisitoista minuuttia myöhässä. Juna lähtee tänään laiturilta neljä, ei laiturilta kaksi. Pahoittelemme viivästystä. Tarkista junan uusi lähtöaika aseman näytöltä.",
    "3": "Moi! Voitko käydä kaupassa kotimatkalla? Tarvitsemme leipää ja kananmunia. Maitoa ei tarvitse ostaa, sitä on vielä jääkaapissa. Minä tulen kotiin noin kuudelta. Teen sitten meille ruokaa. Nähdään illalla!",
    "4": "Hyvää huomenta! Suomen tunti on tänään kirjaston toisessa kerroksessa. Tavallisessa luokassa tehdään remonttia. Tunti alkaa kymmeneltä kuten aina. Ota mukaan vihko ja kynä. Oppikirjaa ei tänään tarvita, koska opettaja antaa teille tekstit.",
    "5": "Hei Sami! Ajattelin, että voisimme mennä lauantaina museoon. Sääennusteen mukaan silloin sataa, joten puisto ei ehkä ole hyvä idea. Museo avautuu kahdeltatoista. Tavataanko sen ovella puoli yksi? Liput maksavat opiskelijoille viisi euroa. Ota opiskelijakortti mukaan.",
    "6": "Minä olen Aino. Olen töissä pienessä kahvilassa. Työpäiväni alkaa aamulla kahdeksalta ja loppuu iltapäivällä kolmelta. Tiistaisin ja torstaisin menen työn jälkeen suomen kurssille. Haluan oppia suomea, koska haluan puhua paremmin asiakkaiden kanssa. Viikonloppuna lepään ja tapaan ystäviä.",
    "7": "Hei! Ostin tämän paidan eilen, mutta se on liian pieni. Väri on hyvä, ja pidän tästä mallista. Haluaisin vaihtaa sen suurempaan kokoon. Minulla on kuitti mukana. Onko teillä samaa paitaa koossa L?",
    "8": "Huomenna aamulla on aurinkoista ja melko viileää. Lämpötila on noin kahdeksan astetta. Iltapäivällä sää lämpenee, ja lämpötila nousee neljääntoista asteeseen. Sade alkaa vasta illalla. Jos lähdet illaksi ulos, ota sateenvarjo mukaan.",
    "9": "Moi! Mä oon vähän myöhässä, koska bussi ei tullut ajoissa. Mä oon siellä noin kymmenen minuutin päästä. Sun ei tarvitse odottaa ulkona. Mene vaan sisälle kahvilaan ja ota pöytä. Mä tuun sinne heti, kun pääsen.",
    "10": "Tervetuloa opiskelijapalveluihin. Toimistomme on avoinna maanantaisin, keskiviikkoisin ja perjantaisin kello kymmenestä kahteen. Voit tulla ilman ajanvarausta. Muina päivinä voit lähettää meille sähköpostia. Vastaamme viesteihin yleensä kahden arkipäivän kuluessa.",

function keyFor(prefix,i){return prefix+':'+i}
function getAnswer(prefix,i){return state.answers[keyFor(prefix,i)]??''}
function getGrade(prefix,i){return state.grades[keyFor(prefix,i)]}
function answerChange(prefix,i,val){state.answers[keyFor(prefix,i)]=val;delete state.grades[keyFor(prefix,i)];save()}
function correct(q,v){const answer=norm(v),ref=norm(q.answer);if(!answer)return false;if(q.type==='tf')return (['o','oikein','true','kyllä'].includes(answer) && ['o','oikein'].includes(ref))||(['v','väärin','false','ei'].includes(answer)&&['v','väärin'].includes(ref));if(q.type==='mc')return answer===ref;return [q.answer,...(q.aliases||[])].some(a=>answer===norm(a));}
function checkAnswer(prefix,i){const q=questionAt(prefix,i),v=getAnswer(prefix,i);if(!String(v).trim()){toast('Choose or type an answer first.');return}state.grades[keyFor(prefix,i)]=correct(q,v)?'yes':(q.type==='open'?'review':'no');save();render()}
function markAnswer(prefix,i,correctNow){state.grades[keyFor(prefix,i)]=correctNow?'yes':'no';save();render()}
function questionAt(prefix,i){let seg=prefix.split(':');if(seg[0]==='reading'||seg[0]==='listening'){let item=DB[seg[0]].find(v=>v.id===seg[1]);return item.questions[i]}if(seg[0]==='mock'){let m=DB.mocks.find(v=>v.id===seg[1]);return m[seg[2]][i]}if(seg[0]==='grammar')return {answer:DB.grammar[Number(seg[1])][1],aliases:[],type:'open'};return {answer:'',type:'open'}}
function showFeedback(q,prefix,i){const grade=getGrade(prefix,i),ans=esc(q.answer),reason=q.explain?`<div class="small" style="margin-top:5px">${esc(q.explain)}</div>`:'';if(!grade)return '';const label=grade==='yes'?'✓ Correct':grade==='no'?'↻ Review this':'? Check your answer against the model';const cl=grade==='yes'?'good':grade==='no'?'bad':'review';return `<div class="feedback ${cl}"><b>${label}</b><div>Model answer: <b>${ans}</b></div>${reason}${grade==='review'?`<div class="actions"><button class="btn sm" onclick="markAnswer('${prefix}',${i},true)">My answer is also correct</button><button class="btn sm outline" onclick="markAnswer('${prefix}',${i},false)">Not correct yet</button></div><div class="small">Open answers can have multiple valid phrasings. Compare meaning manually; the app cannot reliably grade every Finnish phrase.</div>`:''}</div>`}
function questionHTML(q,prefix,i){const val=getAnswer(prefix,i),grade=getGrade(prefix,i);let input='';if(q.type==='mc'){input=q.options.map((o,j)=>`<label class="choice"><input type="radio" name="${esc(prefix)}-q${i}" value="${'ABC'[j]}" ${val==='ABC'[j]?'checked':''} ${grade?'disabled':''} onchange="answerChange('${prefix}',${i},this.value)"><b>${'ABC'[j]}.</b> ${esc(o)}</label>`).join('')}else if(q.type==='tf'){input=['Oikein','Väärin'].map((o,j)=>`<label class="choice"><input type="radio" name="${esc(prefix)}-q${i}" value="${j?'V':'O'}" ${val===(j?'V':'O')?'checked':''} ${grade?'disabled':''} onchange="answerChange('${prefix}',${i},this.value)">${esc(o)}</label>`).join('')}else{input=`<textarea class="answer sm" ${grade?'readonly':''} placeholder="Kirjoita vastaus suomeksi…" aria-label="Answer question ${i+1}" oninput="answerChange('${prefix}',${i},this.value)">${esc(val)}</textarea>`}return `<section class="qcard"><h4><span class="counter">${i+1}</span> ${esc(q.t)}</h4>${input}${!grade?`<div class="actions"><button class="btn sm" onclick="checkAnswer('${prefix}',${i})">Check answer</button></div>`:`<div class="actions"><button class="btn sm outline" onclick="retryAnswer('${prefix}',${i})">Try again</button></div>`}${showFeedback(q,prefix,i)}</section>`}
function retryAnswer(prefix,i){delete state.grades[keyFor(prefix,i)];save();render()}
function quizSummary(prefix,questions){const grades=questions.map((_,i)=>getGrade(prefix,i));let cnt=grades.filter(x=>x==='yes').length,done=grades.filter(x=>x==='yes'||x==='no').length;return {cnt,done,n:questions.length}}
function quizComplete(kind,id,n){const prefix=kind+':'+id,qs=DB[kind].find(x=>x.id===id).questions,z=quizSummary(prefix,qs);if(z.done!==z.n){toast(`Review all ${z.n} answers first.`);return}state.completed[prefix]={score:z.cnt,total:z.n,when:new Date().toISOString()};save();toast('Lesson saved to your progress!');render()}
function lessonSelect(kind){const options=DB[kind].map(x=>`<option value="${esc(x.id)}" ${state.chosen[kind]===x.id?'selected':''}>${esc(x.id)} · ${esc(x.title)}${state.completed[kind+':'+x.id]?' ✓':''}</option>`).join('');return `<label class="selectlabel" for="pick_${kind}">Choose ${kind} lesson</label><select id="pick_${kind}" onchange="setChosen('${kind}',this.value)">${options}</select>`}
function renderReading(){const x=findItem('reading'),p='reading:'+x.id,z=quizSummary(p,x.questions),progress=(z.done/x.questions.length)*100;return `<h2 class="heading">Luetun ymmärtäminen · Reading</h2><p class="sub">Read the entire text. Check negatives, changes, time, price and the action required. Original source exercises plus extra transfer practice.</p><div class="card">${lessonSelect('reading')}<div class="strip">${DB.reading.filter(y=>y.id.startsWith('U')).map(y=>`<button class="chip ${x.id===y.id?'on':''}" onclick="setChosen('reading','${y.id}')">${y.id}${state.completed['reading:'+y.id]?' ✓':''}</button>`).join('')}</div><div class="sectionHead"><h2>${esc(x.title)}</h2><span class="badge2">${z.done}/${z.n} checked</span></div><div class="meta"><span>${esc(x.unit)}</span><span>3 questions</span><span>3 formats: O/V · ABC · short answer</span></div><div class="progress"><i style="width:${progress}%"></i></div><div class="lesson" lang="fi">${txt(x.text)}</div>${x.questions.map((q,i)=>questionHTML(q,p,i)).join('')}<div class="actions"><button class="btn" onclick="quizComplete('reading','${x.id}')">Finish this reading lesson</button><button class="btn outline" onclick="nextLesson('reading')">Next passage →</button></div><div class="source">${esc(x.source)} • Independent practice, not a reproduction of an official HAMK exam.</div></div>`}
function nextLesson(kind){const a=DB[kind],i=a.findIndex(x=>x.id===state.chosen[kind]);state.chosen[kind]=a[(i+1)%a.length].id;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function speakFinnish(textToRead,count=1){if(!('speechSynthesis' in window)){toast('Text-to-speech is not supported in this browser.');return}speechSynthesis.cancel();let voices=speechSynthesis.getVoices(),fi=voices.find(v=>v.lang.toLowerCase().startsWith('fi'));if(!fi)toast('Finnish voice not found. Check iPhone speech voice settings.');let done=0;function step(){if(done>=count)return;let utterance=new SpeechSynthesisUtterance(textToRead);utterance.lang='fi-FI';if(fi)utterance.voice=fi;utterance.rate=.82;utterance.pitch=1;utterance.onend=()=>{done++;step()};utterance.onerror=()=>toast('Could not play Finnish speech on this device.');speechSynthesis.speak(utterance)}step()}
function stopVoice(){try{speechSynthesis.cancel()}catch(e){}}
function reveal(section,id){const k=section+':'+id;state.models[k]=!state.models[k];save();render()}
function renderListening(){let x=findItem('listening'),p='listening:'+x.id,z=quizSummary(p,x.questions);let exposed=!!state.models[p];return `<h2 class="heading">Puheen ymmärtäminen · Listening</h2><p class="sub">Read questions first → listen twice → answer → reveal transcript. Audio is device-generated Finnish, not a real exam recording.</p><div class="card">${lessonSelect('listening')}<div class="sectionHead"><h2>${esc(x.title)}</h2><span class="badge2">${z.done}/${z.n} checked</span></div><p class="small">Do not read the transcript before answering; otherwise it becomes a reading exercise.</p><div class="actions"><button class="btn" onclick="speakFinnish(DB.listening.find(x=>x.id==='${x.id}').script,2)">▶ Listen twice</button><button class="btn outline" onclick="speakFinnish(DB.listening.find(x=>x.id==='${x.id}').script,1)">▶ Play once</button><button class="btn outline" onclick="stopVoice()">■ Stop</button></div><div class="notice">Tip: On iPhone, check Settings → Accessibility → Spoken Content → Voices if the Finnish pronunciation sounds wrong. Voice availability varies by iOS installation.</div>${x.questions.map((q,i)=>questionHTML(q,p,i)).join('')}<div class="actions"><button class="btn" onclick="quizComplete('listening','${x.id}')">Finish listening lesson</button><button class="btn outline" onclick="reveal('listening','${x.id}')">${exposed?'Hide':'Reveal'} transcript</button><button class="btn outline" onclick="nextLesson('listening')">Next →</button></div>${exposed?`<div class="transcript" lang="fi"><b>Transcript</b><br>${txt(x.script)}</div>`:''}<div class="source">${esc(x.source)} • 3 questions</div></div>`}
const rubricNames=['Completes requested details','Meaning is understandable','Ideas connected in a clear sequence','Useful words and forms','Independent, relevant response'];
function draftChange(key,val){state.drafts[key]=val;save();const c=document.getElementById('words');if(c)c.textContent=words(val)+' words'}
function rubricChange(key,i,v){state.mockRatings[key+':'+i]=Number(v);save();let s=document.getElementById('rubricScore');if(s)s.textContent=rubricTotal(key)+'/10'}
function rubricTotal(key){return rubricNames.reduce((a,_,i)=>a+(state.mockRatings[key+':'+i]??0),0)}
function rubricHTML(key){return `${rubricNames.map((n,i)=>`<div class="rubric"><span>${esc(n)}</span><select aria-label="${esc(n)}" onchange="rubricChange('${key}',${i},this.value)">${['0','1','2'].map(v=>`<option ${Number(v)===(state.mockRatings[key+':'+i]??0)?'selected':''} value="${v}">${v} / 2</option>`).join('')}</select></div>`).join('')}<p><b>Practice rubric: <span id="rubricScore">${rubricTotal(key)}/10</span></b></p><p class="tinyline">Self-review, not an automated assessor or official HAMK scoring criteria.</p>`}
function markProductive(kind,id){const key=kind+':'+id;const source=state.drafts[key]||'';if(kind==='writing'&&words(source)<12){toast('Write a fuller response before marking complete.');return}state.completed[key]={score:rubricTotal(key),total:10,when:new Date().toISOString(),self:true};save();toast('Practice saved');render()}
function renderWriting(){let x=findItem('writing'),key='writing:'+x.id,show=!!state.models[key],draft=state.drafts[key]||'';return `<h2 class="heading">Kirjoittaminen · Writing</h2><p class="sub">Complete every instruction. Send a message, explain a reason, ask a question, or give feedback. Compare with an A2 model only after writing.</p><div class="card">${lessonSelect('writing')}<div class="eyebrow">${x.id} · ${esc(x.title)}</div><div class="lesson" lang="fi">${txt(x.task)}</div><label class="selectlabel" for="writeText">Your answer in Finnish</label><textarea id="writeText" class="answer big" placeholder="Hei! …" oninput="draftChange('${key}',this.value)">${esc(draft)}</textarea><p class="textareasub small"><span id="words">${words(draft)} words</span> · Suggested practice length: 35–100 words depending on task. Not an official limit.</p><div class="actions"><button class="btn outline" onclick="reveal('writing','${x.id}')">${show?'Hide':'Compare with'} model answer</button><button class="btn ghost" onclick="speakFinnish(DB.writing.find(x=>x.id==='${x.id}').model,1)">▶ Hear model</button></div>${show?`<div class="model" lang="fi"><b>Model response</b><br>${txt(x.model)}</div><div class="notice" style="margin-top:8px">What to check: ${esc(x.check)}</div>`:''}<h3>Evaluate your response (0–2 per criterion)</h3>${rubricHTML(key)}<div class="actions"><button class="btn" onclick="markProductive('writing','${x.id}')">Save writing practice</button><button class="btn outline" onclick="nextLesson('writing')">Next writing task →</button></div></div>`}
let speakingSeconds=60;
function startSpeakTimer(sec=60){clearInterval(speakTimer);speakingSeconds=sec;let el=document.getElementById('speakTime');if(el)el.textContent=fmtTime(sec);speakTimer=setInterval(()=>{speakingSeconds=Math.max(0,speakingSeconds-1);const e=document.getElementById('speakTime');if(e)e.textContent=fmtTime(speakingSeconds);if(!speakingSeconds){clearInterval(speakTimer);toast('Speaking time finished. Compare your response.')}},1000)}
function stopSpeakTimer(){clearInterval(speakTimer);speakingSeconds=60;const el=document.getElementById('speakTime');if(el)el.textContent='01:00'}
function fmtTime(seconds){return [Math.floor(seconds/60),seconds%60].map(v=>String(v).padStart(2,'0')).join(':')}
async function toggleRecord(){const b=document.getElementById('recordButton');if(recorder&&recorder.state==='recording'){recorder.stop();return}if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==='undefined'){toast('Recording unavailable here. Use iPhone Voice Memos.');return}try{recordStream=await navigator.mediaDevices.getUserMedia({audio:true});recordChunks=[];recorder=new MediaRecorder(recordStream);recorder.ondataavailable=e=>{if(e.data.size)recordChunks.push(e.data)};recorder.onstop=()=>{const blob=new Blob(recordChunks,{type:recorder.mimeType||'audio/webm'});if(playUrl)URL.revokeObjectURL(playUrl);playUrl=URL.createObjectURL(blob);const area=document.getElementById('recordPlayer');if(area)area.innerHTML='<p class="small">Temporary recording (not uploaded or saved):</p><audio controls style="width:100%" src="'+playUrl+'"></audio>';recordStream?.getTracks().forEach(t=>t.stop());if(b)b.textContent='● Record your voice'};recorder.start();if(b)b.textContent='■ Stop recording'}catch(e){toast('Microphone unavailable. Try Safari over HTTPS or Voice Memos.')}}
function renderSpeaking(){const x=findItem('speaking'),key='speaking:'+x.id,show=!!state.models[key];return `<h2 class="heading">Puhuminen · Speaking</h2><p class="sub">Try the Finnish prompt without reading the model. Use a clear answer + detail + <i>koska</i> reason. Follow-ups help you respond independently.</p><div class="card">${lessonSelect('speaking')}<div class="eyebrow">${x.id} · ${esc(x.title)}</div><div class="lesson" lang="fi">${txt(x.prompt)}</div><div class="twocol"><div class="card soft"><div class="eyebrow">Speaking timer</div><div class="timer" id="speakTime">01:00</div><div class="actions"><button class="btn sm" onclick="startSpeakTimer(60)">▶ Start 60 sec</button><button class="btn sm outline" onclick="stopSpeakTimer()">Reset</button></div><div class="small">60 seconds is a training goal, not a published HAMK rule.</div></div><div class="card soft"><div class="eyebrow">Voice recording (optional)</div><p class="small">Practice out loud and play it back. Some offline iPhone viewers restrict microphone access.</p><button id="recordButton" class="btn outline sm" onclick="toggleRecord()">● Record your voice</button><div id="recordPlayer"></div></div></div><div class="actions"><button class="btn outline" onclick="reveal('speaking','${x.id}')">${show?'Hide':'Show'} model + follow-ups</button><button class="btn ghost" onclick="speakFinnish(DB.speaking.find(x=>x.id==='${x.id}').prompt.split('—')[0],1)">▶ Hear question</button></div>${show?`<div class="model" lang="fi"><b>Model answer</b><br>${txt(x.model)}<hr class="sep"><b>English meaning</b><br>${esc(x.meaning)}<hr class="sep"><b>Follow-up practice</b><br>${esc(x.followups)}</div>`:''}<h3>Evaluate your speaking (0–2 each)</h3>${rubricHTML(key)}<div class="actions"><button class="btn" onclick="markProductive('speaking','${x.id}')">Save speaking practice</button><button class="btn outline" onclick="nextLesson('speaking')">Next speaking topic →</button></div></div>`}
function renderGrammar(){let p=Number(state.grammarPage)||0;return `<h2 class="heading">Kielioppi · Grammar laboratory</h2><p class="sub">Twelve core A2 patterns with explanations and 40 sentence drills from your study pack.</p><div class="card"><label class="selectlabel">Choose grammar focus</label><select onchange="grammarPick(this.value)">${DB.grammar_topics.map((x,i)=>`<option ${i===p?'selected':''} value="${i}">${i+1}. ${esc(x[0])}</option>`).join('')}</select><div class="eyebrow" style="margin-top:18px">Grammar ${p+1}/12</div><h2>${esc(DB.grammar_topics[p][0])}</h2><div class="lesson" lang="fi">${esc(DB.grammar_topics[p][1])}</div><p>${esc(DB.grammar_topics[p][2])}</p><div class="model" lang="fi"><b>${esc(DB.grammar_topics[p][3])}</b><br>${esc(DB.grammar_topics[p][4])}</div><div class="actions"><button class="btn outline" onclick="speakFinnish(DB.grammar_topics[${p}][3])">▶ Hear example</button><button class="btn" onclick="grammarPick(${(p+1)%12})">Next grammar point →</button></div></div><div class="card"><h2>Grammar exercises · 40 questions</h2><p class="small">Answer the blank or correct the full sentence. The app checks exact matches and lets you compare alternative valid sentences.</p>${DB.grammar.map((pair,i)=>questionHTML({t:pair[0],type:'open',answer:pair[1]},'grammar:'+i,0)).join('')}</div>`}
function grammarPick(i){state.grammarPage=Number(i);save();render()}
function filteredVocab(){let items=DB.vocabulary.filter(x=>(state.vocabGroup==='all'||x.group===state.vocabGroup)&&(!state.vocabQuery||(x.fi+' '+x.en).toLowerCase().includes(state.vocabQuery.toLowerCase())));return items}
function setVocabGroup(v){state.vocabGroup=v;state.vocabIndex=0;state.vocabRevealed=false;save();render()}
function searchVocab(v){state.vocabQuery=v;state.vocabIndex=0;state.vocabRevealed=false;save();render()}
function nextVocab(dir=1){const len=filteredVocab().length;if(!len)return;state.vocabIndex=(state.vocabIndex+dir+len)%len;state.vocabRevealed=false;save();render()}
function revealVocab(){state.vocabRevealed=!state.vocabRevealed;save();render()}
function rateVocab(rate){const c=filteredVocab()[state.vocabIndex];if(!c)return;state.known[c.fi]=rate;save();nextVocab(1)}
function speakCurrentCard(){const c=filteredVocab()[state.vocabIndex];if(c)speakFinnish(c.fi)}
function renderVocab(){let all=filteredVocab(),c=all[state.vocabIndex]||all[0],known=Object.values(state.known).filter(x=>x==='known').length;return `<h2 class="heading">Sanasto · Vocabulary flashcards</h2><p class="sub">240 Finnish–English cards from your A2 workbook. Tap to reveal meaning; swipe left and right to move between cards.</p><div class="card"><label class="selectlabel">Topic</label><select onchange="setVocabGroup(this.value)"><option value="all">All 240 words</option>${[...new Set(DB.vocabulary.map(x=>x.group))].map(g=>`<option ${state.vocabGroup===g?'selected':''} value="${esc(g)}">${esc(g)}</option>`).join('')}</select><label class="selectlabel">Search a Finnish or English word</label><input class="answer" value="${esc(state.vocabQuery)}" placeholder="e.g. kirja or library" onchange="searchVocab(this.value)"><div class="meta" style="margin:12px 0"><span>${all.length} cards in filter</span><span>${known} known</span><span>${Math.min(state.vocabIndex+1,all.length)} / ${all.length}</span></div>${c?`<div class="floatbox" id="flashcard" ontouchstart="cardTouchStart(event)" ontouchend="cardTouchEnd(event)" onclick="revealVocab()" role="button" tabindex="0" onkeydown="if(event.key==='Enter')revealVocab()"><div class="mini">${esc(c.group)}</div><div class="fi" lang="fi">${esc(c.fi)}</div>${state.vocabRevealed?`<div class="en">${esc(c.en)}</div>`:`<div class="mini" style="margin-top:15px">Tap to show English translation</div>`}</div><div class="actions"><button class="btn outline" onclick="nextVocab(-1)">← Previous</button><button class="btn outline" onclick="nextVocab(1)">Next →</button><button class="btn ghost" onclick="speakCurrentCard()">▶ Hear</button></div><div class="twocol"><button class="btn warn wide" onclick="rateVocab('again')">↻ Review again</button><button class="btn wide" onclick="rateVocab('known')">✓ I know this word</button></div>`:`<div class="notice">No matching cards. Remove your search filter.</div>`}</div>`}
let swipeStart=0;function cardTouchStart(e){swipeStart=e.changedTouches[0].screenX}function cardTouchEnd(e){let delta=e.changedTouches[0].screenX-swipeStart;if(Math.abs(delta)>50){e.preventDefault();e.stopPropagation();nextVocab(delta<0?1:-1)}}

function mockRating(id,kind,i,v){state.mockRatings[`mock:${id}:${kind}:${i}`]=Number(v);save();updateMockPreview(id)}
function mockRatingVal(id,kind,i){return state.mockRatings[`mock:${id}:${kind}:${i}`]}
function mockProductive(m,kind){return m[kind].map((x,i)=>{const key=`mock:${m.id}:${kind}:${i}`,show=state.models[key];return `<div class="card"><div class="eyebrow">${kind.toUpperCase()} TASK ${i+1}</div><div class="lesson" lang="fi">${esc(x.prompt)}</div>${kind==='writing'?`<textarea class="answer big" placeholder="Your full Finnish response…" oninput="mockDraft('${m.id}','writing',${i},this.value)">${esc(state.drafts[key]||'')}</textarea><div id="words-writing${i}" class="small">${words(state.drafts[key]||'')} words</div>`:`<p class="notice">Speak your answer out loud. Use the iPhone Voice Memos app if you need a recording.</p><div class="actions"><button class="btn sm outline" onclick="startSpeakTimer(60)">▶ Start practice minute</button></div>`}<div class="actions"><button class="btn outline sm" onclick="toggleMockModel('${m.id}','${kind}',${i})">${show?'Hide':'Reveal'} model</button></div>${show?`<div class="model" lang="fi">${esc(x.model)}</div>`:''}<label class="selectlabel">Self-rate task (0–10, after completing)</label><select onchange="mockRating('${m.id}','${kind}',${i},this.value)"><option value="" ${mockRatingVal(m.id,kind,i)===undefined?'selected':''}>Not rated</option>${Array.from({length:11},(_,n)=>`<option value="${n}" ${mockRatingVal(m.id,kind,i)===n?'selected':''}>${n}/10</option>`).join('')}</select></div>`}).join('')}
function toggleMockModel(id,kind,i){let k=`mock:${id}:${kind}:${i}`;state.models[k]=!state.models[k];save();render()}
function mockScore(m){const r=quizSummary('mock:'+m.id+':reading',m.reading),l=quizSummary('mock:'+m.id+':listening',m.listening),wr=m.writing.map((_,i)=>mockRatingVal(m.id,'writing',i)),sp=m.speaking.map((_,i)=>mockRatingVal(m.id,'speaking',i));const ws=wr.every(x=>x!==undefined)?wr.reduce((a,b)=>a+b,0)/wr.length:null,ss=sp.every(x=>x!==undefined)?sp.reduce((a,b)=>a+b,0)/sp.length:null;return {r,l,wr,sp,ws,ss,total:r.cnt+l.cnt+(ws||0)+(ss||0)}}
function mockPreview(m){const z=mockScore(m);return `<div class="fourcol"><div class="stat"><b>${z.r.cnt}/10</b><small>Reading · ${z.r.done} checked</small></div><div class="stat"><b>${z.l.cnt}/10</b><small>Listening · ${z.l.done} checked</small></div><div class="stat"><b>${z.ws===null?'—':z.ws.toFixed(1)}/10</b><small>Writing (self-rated)</small></div><div class="stat"><b>${z.ss===null?'—':z.ss.toFixed(1)}/10</b><small>Speaking (self-rated)</small></div></div>`}
function updateMockPreview(id){const m=DB.mocks.find(x=>x.id===id);let el=document.getElementById('mockPreview');if(el)el.innerHTML=mockPreview(m)}
function beginMock(id){state.mockStarted[id]=Date.now();save();updateClock();toast('60-minute practice timer started')}
function updateClock(){if(state.section!=='mocks')return;let id=state.chosen.mocks,t=document.getElementById('mockClock');if(!t)return;if(!state.mockStarted[id]){t.textContent='60:00';return}const remaining=Math.max(0,3600-Math.floor((Date.now()-state.mockStarted[id])/1000));t.textContent=fmtTime(remaining);if(remaining===0)toast('Practice timer ended. Finish marking your test.')}
function finishMock(id){const m=DB.mocks.find(x=>x.id===id),z=mockScore(m);if(z.r.done<10||z.l.done<10||z.ws===null||z.ss===null){toast('Mark 10 reading, 10 listening and rate all writing/speaking tasks.');return}const pass=z.total>=30&&Math.min(z.r.cnt,z.l.cnt,z.ws,z.ss)>=6;state.mockResults[id]={reading:z.r.cnt,listening:z.l.cnt,writing:z.ws,speaking:z.ss,total:z.total,pass,when:new Date().toISOString()};save();render();const el=document.getElementById('mockResult');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}
function renderMocks(){let m=DB.mocks.find(x=>x.id===state.chosen.mocks)||DB.mocks[0],result=state.mockResults[m.id];return `<h2 class="heading">Kokonaisharjoitus · Mock exams</h2><p class="sub">Two full practice sets from your original workbook. <b>Official published HAMK threshold: 30/40 overall, ≥6/10 per section.</b> Productive sections here are self-rated for training only.</p><div class="card gold"><label class="selectlabel">Choose practice test</label><select onchange="setChosen('mocks',this.value)">${DB.mocks.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${esc(x.title)}</option>`).join('')}</select><div class="sectionHead" style="margin-top:15px"><h2>Practice timer</h2><div id="mockClock" class="timer" style="font-size:27px">60:00</div></div><div class="actions"><button class="btn" onclick="beginMock('${m.id}')">Start / restart timer</button><button class="btn outline" onclick="stopVoice()">Stop audio</button></div><div class="small">60 minutes for your whole mock is a preparation choice. It does not reproduce HAMK's undisclosed per-section timings.</div></div><div id="mockPreview">${mockPreview(m)}</div><div class="card"><h2>Part 1 · Reading — 10 points</h2><p class="small">Answers use short Finnish phrases or true/false. Check each answer after you try it.</p></div>${m.readingTexts.map(b=>readSectionMock(m,b)).join('')}<div class="card"><h2>Part 2 · Listening — 10 points</h2><p class="small">Audio is synthesized from original workbook scripts. Do not reveal the transcript before listening.</p></div>${m.listenSections.map((b,i)=>listenSectionMock(m,b,i)).join('')}<div class="card"><h2>Part 3 · Writing — 10 points total</h2><p class="small">Complete both tasks; self-score each 0–10, averaged for this practice section.</p></div>${mockProductive(m,'writing')}<div class="card"><h2>Part 4 · Speaking — 10 points total</h2><p class="small">Perform all four oral tasks; self-score each 0–10, averaged for this practice section.</p><div class="timer" id="speakTime" style="font-size:25px">01:00</div></div>${mockProductive(m,'speaking')}<div class="card"><h2>Finish this mock exam</h2><div class="actions"><button class="btn" onclick="finishMock('${m.id}')">Calculate practice result (40 points)</button></div><div id="mockResult">${result?`<div class="result ${result.pass?'good':'bad'}">${result.total.toFixed(1)} / 40 · ${result.pass?'Meets numerical practice threshold':'Below numerical practice threshold'}</div><p>Reading ${result.reading}/10 · Listening ${result.listening}/10 · Writing ${result.writing.toFixed(1)}/10 · Speaking ${result.speaking.toFixed(1)}/10</p><p class="small">This only checks the numeric rule using workbook answers and your own ratings. It is not an official proficiency judgement.</p>`:''}</div></div>`}
function renderStats(){const groups=[['Reading','reading',DB.reading.length],['Listening','listening',DB.listening.length],['Writing','writing',DB.writing.length],['Speaking','speaking',DB.speaking.length]];let known=Object.values(state.known).filter(x=>x==='known').length;return `<h2 class="heading">Your study progress</h2><p class="sub">Stored locally on this device when browser storage is available. Export a backup before clearing Safari data or moving devices.</p><div class="card">${groups.map(([title,key,total])=>{let d=doneCount(key);return `<div style="margin:17px 0"><div class="sectionHead"><b>${title}</b><span>${d}/${total} completed</span></div><div class="progress"><i style="width:${(d/total)*100}%"></i></div></div>`}).join('')}<div class="twocol"><div class="stat"><b>${known}/${DB.vocabulary.length}</b><small>Vocabulary marked known</small></div><div class="stat"><b>${Object.keys(state.mockResults).length}/2</b><small>Completed mock exams</small></div></div></div><div class="card"><h2>Mock results</h2>${DB.mocks.map(m=>{let r=state.mockResults[m.id];return `<p><b>${m.title}:</b> ${r?`${r.total.toFixed(1)}/40 · ${r.pass?'meets numerical target':'below target'}`:'Not completed yet'}</p>`}).join('')}<div class="notice">The true HAMK assessment includes performance judgement. Workbook self-scores are for study guidance only.</div></div><div class="card"><h2>Backup and settings</h2><div class="actions"><button class="btn" onclick="exportProgress()">↓ Export progress JSON</button><label class="btn outline" style="cursor:pointer">↑ Import progress<input type="file" accept="application/json,.json" style="display:none" onchange="importProgress(this)"></label><button class="btn outline" onclick="state.dark=!state.dark;save();render()">${state.dark?'Light':'Dark'} mode</button></div><div class="actions"><button class="btn negative sm" onclick="resetProgress()">Reset all saved answers</button></div><p class="small">This app sends nothing to a server. Backups are plain JSON and can include your writing. Keep them private.</p></div><div class="card"><h2>Verified sources and limitations</h2><p>This self-contained app incorporates original practice material from your HAMK Finnish A2 Study Pack and selected exercises from 02_reading.pdf. It also adds new passages and transfer practice.</p><ul class="studylist"><li><a target="_blank" rel="noopener" href="https://www.hamk.fi/en/come-to-study/tuition-fees-and-scholarships/">HAMK A2 exam arrangements and pass rules</a></li><li><a target="_blank" rel="noopener" href="https://ykitesti.solki.jyu.fi/tutustu-testiin/testifin/">Official YKI basic-level sample exercise types</a></li><li><a target="_blank" rel="noopener" href="https://github.com/jahid-github/Suomen_Kielen_Kurssit">Your Finnish-language study repository</a></li></ul><p class="footnote">YKI basic test exercise formats are reference patterns; this app does not claim access to actual HAMK exam questions. Listening uses browser text-to-speech, not a human speaker. Writing, speaking, and variant open answers require honest human review.</p></div>`}
function exportProgress(){const blob=new Blob([JSON.stringify({app:'suomia2_v4',savedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Finnish_A2_Study_Progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
async function importProgress(input){let file=input.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj.state||!obj.state.answers)throw Error('Unknown backup format');if(!confirm('Replace your progress with the imported backup?'))return;state={...JSON.parse(JSON.stringify(defaultState)),...obj.state,chosen:{...defaultState.chosen,...obj.state.chosen}};save();render();toast('Study progress imported')}catch(e){toast('Could not read this backup file')}}
function resetProgress(){if(confirm('Reset progress, drafts, scores, and marked vocabulary on this iPhone?')){state=JSON.parse(JSON.stringify(defaultState));save();render();toast('Progress reset')}}
window.addEventListener('pagehide',()=>{save();stopVoice();clearInterval(speakTimer);recordStream?.getTracks().forEach(t=>t.stop())});
setInterval(()=>{if(state.section==='mocks')updateClock()},1000);
render();
</script>
</body></html>
