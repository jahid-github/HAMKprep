<script type="application/json" id="dataset">{"reading": [{"id": "R1", "unit": "Workbook • Library notice", "title": "Library notice", "text": "Kirjasto on tällä viikolla avoinna maanantaista torstaihin kello 9–19. Perjantaina kirjasto suljetaan jo kello 15 henkilökunnan koulutuksen vuoksi. Lauantaina kirjasto on avoinna kello 10–14. Sunnuntaina kirjasto on suljettu. Kirjoja voi palauttaa ulkona olevaan palautuslaatikkoon myös kirjaston ollessa suljettu.", "questions": [{"t": "Mihin aikaan kirjasto suljetaan perjantaina?", "type": "mc", "options": ["14.00", "15.00", "19.00"], "answer": "B", "aliases": ["15.00"], "explain": "The exception on Friday is 15:00."}, {"t": "Miksi perjantain aukioloaika on lyhyempi?", "type": "open", "options": [], "answer": "Henkilökunnan koulutuksen vuoksi", "aliases": ["koulutuksen vuoksi"], "explain": "Because staff have training."}, {"t": "Kirjoja voi palauttaa sunnuntaina palautuslaatikkoon.", "type": "tf", "options": [], "answer": "O", "aliases": ["oikein"], "explain": "The outdoor return box can be used on Sunday."}], "source": "HAMK Finnish A2 Study Pack • Reading"}, {"id": "R2", "unit": "Workbook • A class message", "title": "A class message", "text": "Hei opiskelijat! Huomisen suomen tunti alkaa kello 10, ei kello 9. Tapaamme luokassa B204. Ota mukaan oppikirja ja kuulokkeet. Kotitehtävä pitää palauttaa tänään kello 18 mennessä. Jos olet sairas, lähetä minulle viesti. Terveisin opettaja Leena", "questions": [{"t": "Milloin huomisen tunti alkaa?", "type": "open", "options": [], "answer": "Kello 10", "aliases": ["10"], "explain": "The lesson starts at 10, not 9."}, {"t": "Mitkä kaksi tavaraa pitää ottaa mukaan?", "type": "open", "options": [], "answer": "Oppikirja ja kuulokkeet", "aliases": ["oppikirjan ja kuulokkeet"], "explain": "Bring both textbook and headphones."}, {"t": "Kotitehtävä palautetaan huomenna tunnilla.", "type": "tf", "options": [], "answer": "V", "aliases": ["väärin"], "explain": "Homework is due today by 18:00."}], "source": "HAMK Finnish A2 Study Pack • Reading"}, {"id": "R3", "unit": "Workbook • Apartment advertisement", "title": "Apartment advertisement", "text": "Vuokrataan valoisa yksiö keskustan läheltä. Vuokra 620 euroa kuukaudessa. Vesi maksaa 20 euroa kuukaudessa. Sähkö ei sisälly vuokraan. Asunnossa on pieni parveke. Talossa ei ole hissiä. Asunto on vapaa 1. marraskuuta. Näyttö sunnuntaina kello 13–14. Ilmoittaudu näyttöön sähköpostilla.", "questions": [{"t": "Paljonko vuokra ja vesi maksavat yhteensä kuukaudessa?", "type": "open", "options": [], "answer": "640 euroa", "aliases": ["640"], "explain": "620 + 20 = 640 euros; electricity is separate."}, {"t": "Talossa on hissi.", "type": "tf", "options": [], "answer": "V", "aliases": ["väärin"], "explain": "The building has no lift."}, {"t": "Miten ilmoittaudut näyttöön?", "type": "open", "options": [], "answer": "Sähköpostilla", "aliases": ["sähköpostitse"], "explain": "Registration is by email."}], "source": "HAMK Finnish A2 Study Pack • Reading"}, {"id": "R4", "unit": "Workbook • Buy a used table", "title": "Buy a used table", "text": "Myydään puinen ruokapöytä, 40 euroa. Pöytä on hyvässä kunnossa, mutta pinnassa on pieni naarmu. Pituus 120 cm ja leveys 80 cm. Nouto myyjän kotoa lauantaina tai sunnuntaina. Kuljetusta ei ole. Tuolit eivät kuulu hintaan. Lähetä viesti, jos olet kiinnostunut.", "questions": [{"t": "Mikä vika pöydässä on?", "type": "open", "options": [], "answer": "Pinnassa on pieni naarmu", "aliases": ["naarmu"], "explain": "The surface has a small scratch."}, {"t": "Mitä ostajan täytyy tehdä?", "type": "mc", "options": ["odottaa toimitusta", "hakea pöytä", "ostaa tuolit"], "answer": "B", "aliases": ["hakea pöytä"], "explain": "Buyer collects the table."}, {"t": "Neljä tuolia sisältyy hintaan.", "type": "tf", "options": [], "answer": "V", "aliases": ["väärin"], "explain": "Chairs are not included."}], "source": "HAMK Finnish A2 Study Pack • Reading"}, {"id": "R5", "unit": "Workbook • A changed meeting", "title": "A changed meeting", "text": "Moi! En pääse tänään uimahalliin, koska työvuoroni loppuu vasta seitsemältä. Voitaisiinko mennä huomenna? Pääsen huomenna jo neljältä. Tavataan uimahallin ovella puoli kuusi. Lähetä viesti, jos aika ei sovi. Terveisin Mira", "questions": [{"t": "Miksi Mira ei voi mennä tänään?", "type": "open", "options": [], "answer": "Työvuoro loppuu vasta seitsemältä", "aliases": ["työvuoro loppuu kello 19"], "explain": "Her shift ends at 19:00."}, {"t": "Mihin aikaan Mira ehdottaa tapaamista?", "type": "mc", "options": ["16.00", "17.30", "18.30"], "answer": "B", "aliases": ["17.30"], "explain": "Puoli kuusi is 17:30."}, {"t": "Missä tavataan?", "type": "open", "options": [], "answer": "Uimahallin ovella", "aliases": ["ovella"], "explain": "Meet at the swimming hall entrance."}], "source": "HAMK Finnish A2 Study Pack • Reading"}, {"id": "R6", "unit": "Workbook • Lunch menu", "title": "Lunch menu", "text": "Lounas maanantaina kello 11–14. Kanakeitto 8,50 euroa. Kasvispasta 9 euroa. Opiskelijat saavat yhden euron alennuksen opiskelijakortilla. Lounaaseen kuuluu leipä ja vesi. Kahvi maksaa erikseen 2 euroa. Kasvispasta sisältää maitoa.", "questions": [{"t": "Paljonko kasvispasta maksaa opiskelijakortilla?", "type": "open", "options": [], "answer": "8 euroa", "aliases": ["8"], "explain": "9 − 1 = 8 euros."}, {"t": "Kahvi sisältyy lounaaseen.", "type": "tf", "options": [], "answer": "V", "aliases": ["väärin"], "explain": "Coffee costs extra."}, {"t": "Onko kasvispasta maidoton?", "type": "open", "options": [], "answer": "Ei", "aliases": ["ei ole"], "explain": "Vegetarian pasta contains milk."}], "source": "HAMK Finnish A2 Study Pack • Reading"}, {"id": "R7", "unit": "Workbook • Work shift", "title": "Work shift", "text": "Hei! Torstain työvuoro alkaa poikkeuksellisesti kello 7.30. Tule henkilökunnan ovesta, koska pääovi aukeaa vasta yhdeksältä. Työvuoro loppuu kello 14. Jos sairastut, soita esihenkilölle ennen työvuoron alkua. Pelkkä sähköposti ei riitä. Terveisin Sanna", "questions": [{"t": "Mitä ovea työntekijän pitää käyttää?", "type": "open", "options": [], "answer": "Henkilökunnan ovea", "aliases": ["henkilökunnan ovesta"], "explain": "Use the staff entrance."}, {"t": "Työvuoro alkaa tavalliseen aikaan.", "type": "tf", "options": [], "answer": "V", "aliases": ["väärin"], "explain": "Poikkeuksellisesti means exceptionally."}, {"t": "Mitä pitää tehdä sairaana ja milloin?", "type": "open", "options": [], "answer": "Soittaa esihenkilölle ennen työvuoron alkua", "aliases": ["soittaa ennen työvuoroa"], "explain": "Call supervisor before start, not just email."}], "source": "HAMK Finnish A2 Study Pack • Reading"}, {"id": "R8", "unit": "Workbook • Building notice", "title": "Building notice", "text": "Vesikatko tiistaina kello 9–12. Katkon aikana asunnoissa ei ole vettä. Ota tarvitsemasi juomavesi talteen ennen kello yhdeksää. Pesutupaa ei voi käyttää katkon aikana. Jos vettä ei tule vielä kello 12 jälkeen, ota yhteyttä huoltoon. Pahoittelemme haittaa.", "questions": [{"t": "Kuinka kauan ilmoitettu vesikatko kestää?", "type": "open", "options": [], "answer": "Kolme tuntia", "aliases": ["3 tuntia"], "explain": "09:00–12:00 = 3 hours."}, {"t": "Mitä asukkaan pitää tehdä ennen katkoa?", "type": "open", "options": [], "answer": "Ottaa juomavettä talteen", "aliases": ["vettä talteen"], "explain": "Store drinking water beforehand."}, {"t": "Pesutupaa voi käyttää kello 10.", "type": "tf", "options": [], "answer": "V", "aliases": ["väärin"], "explain": "No laundry room during outage."}], "source": "HAMK Finnish A2 Study Pack • Reading"}, {"id": "R9", "unit": "Workbook • A beginner swimming course", "title": "A beginner swimming course", "text": "Aikuisten uimakurssi alkaa 6. lokakuuta. Kurssi on tiistaisin kello 18–19, yhteensä viisi kertaa. Kurssi on tarkoitettu aloittelijoille. Hinta on 45 euroa. Ilmoittaudu viimeistään 29. syyskuuta. Ota mukaan uimapuku ja pyyhe. Kurssille mahtuu 12 osallistujaa.", "questions": [{"t": "Kenelle kurssi on tarkoitettu?", "type": "open", "options": [], "answer": "Aloittelijoille", "aliases": ["aloittelijat"], "explain": "For beginners."}, {"t": "Mikä on viimeinen ilmoittautumispäivä?", "type": "open", "options": [], "answer": "29. syyskuuta", "aliases": ["29.9."], "explain": "Registration deadline is September 29."}, {"t": "Kuinka monta opetuskertaa on?", "type": "open", "options": [], "answer": "Viisi", "aliases": ["5"], "explain": "Five classes total."}], "source": "HAMK Finnish A2 Study Pack • Reading"}, {"id": "R10", "unit": "Workbook • A personal email", "title": "A personal email", "text": "Moi Ali! Muutin viime kuussa uuteen asuntoon. Vanha asunto oli lähellä työtä, mutta siellä oli paljon melua. Uusi koti on kauempana, joten menen nyt töihin junalla. Matka kestää 35 minuuttia. Pidän uudesta kodista, koska täällä on rauhallista ja metsä on lähellä. Tule käymään ensi viikonloppuna! Terveisin Olli", "questions": [{"t": "Miksi Olli halusi vaihtaa asuntoa?", "type": "open", "options": [], "answer": "Vanhassa asunnossa oli melua", "aliases": ["melua"], "explain": "The old home was noisy."}, {"t": "Uusi asunto on lähempänä työpaikkaa.", "type": "tf", "options": [], "answer": "V", "aliases": ["väärin"], "explain": "The new apartment is farther away."}, {"t": "Mitä Olli pyytää Alia tekemään?", "type": "open", "options": [], "answer": "Kylään ensi viikonloppuna", "aliases": ["tulemaan kylään"], "explain": "Invitation to visit next weekend."}], "source": "HAMK Finnish A2 Study Pack • Reading"}, {"id": "U1A", "unit": "Notices", "title": "Library entrance • Kirjaston sisäänkäynti", "text": "KIRJASTON ASIAKKAILLE\nPääovi on suljettu tiistaina 12.5. oven korjauksen vuoksi. Kirjasto on kuitenkin avoinna normaalisti kello 9–19. Tulkaa sisään pihan puolelta. Lasten tapahtuma alkaa alakerrassa kello 16. Henkilökunta auttaa tarvittaessa.", "questions": [{"t": "Kirjasto on suljettu koko tiistain.", "type": "tf", "options": [], "answer": "Väärin", "aliases": [], "explain": "Kuitenkin avoinna normaalisti: the library stays open."}, {"t": "Mistä asiakkaat pääsevät sisään?", "type": "open", "options": [], "answer": "Pihan puolelta", "aliases": ["pihalta"], "explain": "Temporary entrance is from the yard."}, {"t": "Milloin lasten tapahtuma alkaa?", "type": "mc", "options": ["Kello 9", "Kello 16", "Kello 19"], "answer": "B", "aliases": [], "explain": "The event begins at 16."}], "source": "02_reading.pdf • source exercise"}, {"id": "U1B", "unit": "Notices", "title": "Water interruption • Vesikatko", "text": "VESIKATKO TORSTAINA\nTalossa ei tule vettä torstaina kello 10–12, koska kellarin putkia korjataan. Ota juomavettä valmiiksi ennen kello kymmentä. Pesutupaa voi käyttää vasta kello 13. Jos vettä ei tule vielä kello 12.30, soita huoltoon numeroon 010 555 0140.", "questions": [{"t": "Miksi vettä ei tule?", "type": "open", "options": [], "answer": "Koska kellarin putkia korjataan", "aliases": ["kellarin putkia korjataan"], "explain": "Reason: pipe repairs in the basement."}, {"t": "Pesutupaa voi käyttää heti kello 12.", "type": "tf", "options": [], "answer": "Väärin", "aliases": [], "explain": "Vasta kello 13 = only from 13."}, {"t": "Milloin asukkaan pitää soittaa huoltoon?", "type": "mc", "options": ["Jos katko alkaa kymmeneltä", "Jos vettä ei tule puoli yhdeltä", "Aina ennen torstaita"], "answer": "B", "aliases": [], "explain": "Call if water is still unavailable at 12:30."}], "source": "02_reading.pdf • source exercise"}, {"id": "U1C", "unit": "Notices", "title": "Community room • Kerhohuone", "text": "TALOYHTIÖN KERHOHUONE\nKerhohuoneen siivous siirtyy perjantaista lauantaille. Perjantaina huone on siis asukkaiden käytössä. Lauantaina huone on suljettu kello 8–14. Sunnuntain kahvitilaisuus järjestetään normaalisti kello 15. Tuo oma muki. Kahvi ja tee ovat maksuttomia.", "questions": [{"t": "Minä päivänä huone siivotaan?", "type": "open", "options": [], "answer": "Lauantaina", "aliases": [], "explain": "Siirtyy perjantaista lauantaille = moved to Saturday."}, {"t": "Mitä sunnuntain tilaisuuteen pitää tuoda?", "type": "open", "options": [], "answer": "Oma muki", "aliases": ["oma muki mukaan"], "explain": "Bring your own mug."}, {"t": "Sunnuntaina teestä pitää maksaa.", "type": "tf", "options": [], "answer": "Väärin", "aliases": [], "explain": "Maksuttomia = free."}], "source": "02_reading.pdf • source exercise"}, {"id": "U2A", "unit": "Advertisements", "title": "Swimming course • Uimakurssi", "text": "AIKUISTEN UINTIKURSSI\nHaluatko oppia uimaan? Kurssi alkaa 3.6. ja kokoontuu neljä kertaa keskiviikkoisin kello 18–19. Hinta on 48 euroa. Hintaan sisältyvät opetus ja uimahallin pääsymaksu. Ota mukaan uimapuku ja pyyhe. Ilmoittaudu viimeistään 28.5. Kurssille mahtuu kymmenen osallistujaa.", "questions": [{"t": "Milloin kurssi alkaa?", "type": "open", "options": [], "answer": "3.6.", "aliases": ["3. kesäkuuta"], "explain": "Starting date 3 June, not registration deadline."}, {"t": "Pääsymaksu maksetaan erikseen.", "type": "tf", "options": [], "answer": "Väärin", "aliases": [], "explain": "Entrance fee included."}, {"t": "Mitkä kaksi tavaraa osallistuja ottaa mukaan?", "type": "open", "options": [], "answer": "Uimapuku ja pyyhe", "aliases": ["uimapuvun ja pyyhkeen"], "explain": "Both items are required."}], "source": "02_reading.pdf • source exercise"}, {"id": "U2B", "unit": "Advertisements", "title": "Used bicycle • Polkupyörä", "text": "MYYDÄÄN NAISTEN POLKUPYÖRÄ\nPunainen, kolme vuotta vanha pyörä. Uudet renkaat, hyvät jarrut. Etuvalo ei toimi. Hinta 85 euroa, lukko kuuluu hintaan. Pyörää voi kokeilla lauantaina kello 11–14 Hämeenlinnassa. En kuljeta pyörää ostajalle. Ota yhteyttä viestillä, sillä en voi vastata puheluihin työpäivän aikana.", "questions": [{"t": "Mikä pyörässä on rikki?", "type": "open", "options": [], "answer": "Etuvalo", "aliases": [], "explain": "The front light does not work."}, {"t": "Miten myyjään kannattaa ottaa yhteyttä?", "type": "mc", "options": ["Puhelulla työpäivän aikana", "Viestillä", "Kirjeellä"], "answer": "B", "aliases": [], "explain": "Seller requests a text message."}, {"t": "Myyjä tuo pyörän ostajan kotiin.", "type": "tf", "options": [], "answer": "Väärin", "aliases": [], "explain": "En kuljeta = I do not deliver."}], "source": "02_reading.pdf • source exercise"}, {"id": "U2C", "unit": "Advertisements", "title": "Rental flat • Vuokra-asunto", "text": "VUOKRATAAN PIENI KAKSIO\nRauhallinen asunto lähellä keskustaa. Vuokra 690 €/kk. Vesi 22 €/henkilö/kk. Sähkö ei sisälly vuokraan. Talossa on yhteinen sauna. Asunto vapautuu 1.8. Lemmikit sallittu, tupakointi kielletty. Asuntoa voi katsoa tiistaina kello 17. Varaa oma esittelyaika etukäteen.", "questions": [{"t": "Kuinka paljon yksi henkilö maksaa vuokraa ja vesimaksua yhteensä kuukaudessa?", "type": "open", "options": [], "answer": "712 euroa", "aliases": ["712"], "explain": "690 + 22 = 712; electricity excluded."}, {"t": "Asuntoon saa ottaa kissan.", "type": "tf", "options": [], "answer": "Oikein", "aliases": [], "explain": "Lemmikit sallittu = pets permitted."}, {"t": "Mitä pitää tehdä ennen asunnon katsomista?", "type": "mc", "options": ["Ostaa sähkö", "Varata esittelyaika", "Muuttaa asuntoon"], "answer": "B", "aliases": [], "explain": "Book a viewing in advance."}], "source": "02_reading.pdf • source exercise"}, {"id": "U3C", "unit": "Emails", "title": "Borrowed computer • Lainattu tietokone", "text": "Aihe: Lainattu tietokone\nHei,\nLainasit koulun kannettavan viime viikolla. Laina-aika päättyy torstaina, mutta voit jatkaa sitä maanantaihin asti, jos tarvitset konetta viikonlopun projektissa. Lähetä jatkopyyntö keskiviikkona. Palauta kone ja laturi palvelupisteeseen. Hiirtä ei tarvitse palauttaa, koska se on sinun oma.\nTerveisin, IT-palvelut", "questions": [{"t": "Minä päivänä tavallinen laina-aika päättyy?", "type": "open", "options": [], "answer": "Torstaina", "aliases": [], "explain": "Ordinary return deadline is Thursday."}, {"t": "Mitä pitää tehdä, jos hän haluaa pitää koneen viikonlopun?", "type": "open", "options": [], "answer": "Lähettää jatkopyyntö keskiviikkona", "aliases": ["jatkopyyntö keskiviikkona"], "explain": "Extension request must be sent Wednesday."}, {"t": "Mitkä kaksi tavaraa palautetaan?", "type": "open", "options": [], "answer": "Tietokone ja laturi", "aliases": ["kone ja laturi"], "explain": "Mouse is the student’s own."}], "source": "02_reading.pdf • source exercise"}, {"id": "U4C", "unit": "Short messages", "title": "Project chat • Ryhmäprojekti", "text": "Ravi: Voidaanko tehdä projekti tänään koululla kello 15?\nAino: Olen töissä neljään asti. Pääsen verkkoon kello 17, mutta en koululle.\nRavi: Tehdään niin. Lähetän linkin ennen viittä.\nAino: Hyvä! Kirjoitan tekstin. Voitko sinä tehdä kuvat?\nRavi: Joo, teen kuvat. Palautetaan työ yhdessä huomenna.", "questions": [{"t": "Missä ja milloin ryhmä työskentelee?", "type": "open", "options": [], "answer": "Verkossa kello 17", "aliases": ["verkossa viideltä"], "explain": "Final agreed time and place: online at 17."}, {"t": "Kuka tekee kuvat?", "type": "open", "options": [], "answer": "Ravi", "aliases": [], "explain": "Ravi agrees to make images."}, {"t": "He palauttavat työn tänään.", "type": "tf", "options": [], "answer": "Väärin", "aliases": [], "explain": "Submission is tomorrow."}], "source": "02_reading.pdf • source exercise"}, {"id": "U5C", "unit": "Workplace texts", "title": "Care workplace • Työpaikka", "text": "HENKILÖKUNNALLE\nTiistain kahvitauko pidetään pienessä taukohuoneessa, koska isossa huoneessa on koulutus. Lähihoitaja Elina näyttää uusille opiskelijoille, missä puhtaat työvaatteet ovat. Opiskelijat eivät käytä uusia laitteita yksin. Jos et osaa käyttää laitetta, pyydä ohjaaja paikalle. Koulutuksen jälkeen iso taukohuone on taas käytössä.", "questions": [{"t": "Miksi kahvitauko on pienessä huoneessa?", "type": "open", "options": [], "answer": "Koska isossa huoneessa on koulutus", "aliases": ["isossa huoneessa on koulutus"], "explain": "Large room is being used for training."}, {"t": "Mitä Elina näyttää opiskelijoille?", "type": "open", "options": [], "answer": "Missä puhtaat työvaatteet ovat", "aliases": ["puhtaat työvaatteet"], "explain": "She shows where clean work clothes are."}, {"t": "Mitä opiskelija tekee, jos hän ei osaa käyttää laitetta?", "type": "open", "options": [], "answer": "Pyytää ohjaajan paikalle", "aliases": ["pyytää apua ohjaajalta"], "explain": "Ask for supervisor, do not use device alone."}], "source": "02_reading.pdf • source exercise"}, {"id": "U6C", "unit": "Schedules", "title": "Service hours • Aukioloajat", "text": "PALVELUPISTEEN AIKATAULU\nPalvelupiste on maanantaista torstaihin kello 9–16. Perjantaina se sulkeutuu jo kello 14. Suuret näytöt palautetaan aina henkilökunnalle. Pienet laitteet voi palauttaa perjantaina palautuslaatikkoon kello 20 asti. Lounastauko alkaa perjantaina kello 13.", "questions": [{"t": "Voiko suuren näytön palauttaa henkilökunnalle perjantaina kello 15?", "type": "open", "options": [], "answer": "Ei", "aliases": [], "explain": "Closes at 14; large monitor must be handed to staff."}, {"t": "Milloin perjantain lounastauko alkaa?", "type": "open", "options": [], "answer": "Kello 13", "aliases": ["13"], "explain": "At 13."}, {"t": "Minne pienen laitteen voi palauttaa kello 18?", "type": "open", "options": [], "answer": "Palautuslaatikkoon", "aliases": [], "explain": "The return box works until 20."}], "source": "02_reading.pdf • adapted service hours example"}, {"id": "U7C", "unit": "Instructions", "title": "Course sign-up • Ilmoittautuminen", "text": "ILMOITTAUTUMISOHJE\nValitse kurssi ja paina Ilmoittaudu. Täytä nimesi, sähköpostiosoitteesi ja puhelinnumerosi. Tarkista tiedot ennen lähettämistä. Saat vahvistuksen sähköpostiin. Jos viestiä ei tule saman päivän aikana, tarkista roskapostikansio. Älä täytä lomaketta heti uudelleen. Jos vahvistusta ei löydy, ota yhteyttä toimistoon seuraavana arkipäivänä.", "questions": [{"t": "Mitkä kolme yhteystietoa lomakkeeseen kirjoitetaan?", "type": "open", "options": [], "answer": "Nimi, sähköpostiosoite ja puhelinnumero", "aliases": [], "explain": "All three contact fields."}, {"t": "Mitä tarkistetaan, jos vahvistus ei tule?", "type": "open", "options": [], "answer": "Roskapostikansio", "aliases": [], "explain": "Check spam folder."}, {"t": "Mitä pitää tehdä, jos vahvistusta ei löydy?", "type": "open", "options": [], "answer": "Ota yhteyttä toimistoon seuraavana arkipäivänä", "aliases": ["ottaa yhteyttä toimistoon"], "explain": "Contact office next workday."}], "source": "02_reading.pdf • source exercise"}, {"id": "U8C", "unit": "News and information", "title": "AI language trial • Kieliohjelma", "text": "KOULU KOKEILEE UUTTA OHJELMAA\nRantakoulun aikuisopiskelijat kokeilevat uutta kieliohjelmaa kolmen viikon ajan. Ohjelmassa voi kuunnella lyhyitä keskusteluja ja harjoitella sanoja. Opettaja tarkistaa tehtävät yhdessä opiskelijoiden kanssa. Ohjelma käyttää tekoälyä, mutta se voi tehdä virheitä. Kokeilun lopussa opiskelijat kertovat, mikä auttoi oppimista ja mikä oli vaikeaa. Ohjelmaa ei käytetä tämän kurssin loppukokeessa.", "questions": [{"t": "Kuinka kauan kokeilu kestää?", "type": "open", "options": [], "answer": "Kolme viikkoa", "aliases": ["3 viikkoa"], "explain": "Trial lasts three weeks."}, {"t": "Mainitse kaksi asiaa, joita ohjelmassa voi tehdä.", "type": "open", "options": [], "answer": "Kuunnella keskusteluja ja harjoitella sanoja", "aliases": [], "explain": "Both listening and vocabulary."}, {"t": "Ohjelma on käytössä loppukokeessa.", "type": "tf", "options": [], "answer": "Väärin", "aliases": [], "explain": "Not used in final exam."}], "source": "02_reading.pdf • source exercise"}, {"id": "U9C", "unit": "Forms", "title": "Library card form • Kirjastokortti", "text": "KIRJASTOKORTTIHAKEMUS\nPakolliset tiedot: nimi, syntymäaika ja osoite. Puhelinnumero tai sähköpostiosoite tarvitaan ilmoituksia varten; voit antaa myös molemmat. Alle 15-vuotias tarvitsee huoltajan allekirjoituksen. Ensimmäinen kortti on maksuton. Kadonneen kortin tilalle tehtävä uusi kortti maksaa kolme euroa. Kortti noudetaan kirjastosta henkilöllisyystodistuksen kanssa.", "questions": [{"t": "Pitääkö aikuisen antaa sekä puhelinnumero että sähköpostiosoite?", "type": "open", "options": [], "answer": "Ei", "aliases": [], "explain": "Either phone OR email is enough."}, {"t": "Kenen allekirjoituksen 12-vuotias tarvitsee?", "type": "open", "options": [], "answer": "Huoltajan", "aliases": ["huoltajan allekirjoituksen"], "explain": "Parent/guardian signs for under 15."}, {"t": "Mitä ensimmäinen kortti maksaa, ja mistä sen saa?", "type": "open", "options": [], "answer": "Maksuton, kirjastosta", "aliases": [], "explain": "Free, collected at library."}], "source": "02_reading.pdf • source exercise"}, {"id": "U10C", "unit": "Signs", "title": "Outside signs • Ulkokyltit", "text": "Kyltti A: ASIAKASPYSÄKÖINTI 2 H. KÄYTÄ PYSÄKÖINTIKIEKKOA.\nKyltti B: POLKUPYÖRÄT TÄHÄN. ÄLÄ JÄTÄ PYÖRÄÄ OVEN ETEEN.\nKyltti C: PIHA SULJETTU HUOLTOTYÖN AJAKSI. KULKU RANTAKADUN KAUTTA.", "questions": [{"t": "Kuinka kauan asiakas voi pysäköidä?", "type": "open", "options": [], "answer": "Kaksi tuntia", "aliases": ["2 tuntia"], "explain": "2H stands for two hours."}, {"t": "Mihin pyörää ei saa jättää?", "type": "open", "options": [], "answer": "Oven eteen", "aliases": [], "explain": "Not in front of entrance."}, {"t": "Mistä pihalle pitää nyt kulkea?", "type": "open", "options": [], "answer": "Rantakadun kautta", "aliases": [], "explain": "Maintenance redirects access."}], "source": "02_reading.pdf • source exercise"}, {"id": "U11C", "unit": "Everyday services", "title": "Shop exchanges • Vaihto-ohje", "text": "KAARIKAUPAN VAIHTO-OHJE\nTässä kampanjassa käyttämättömän paidan voi vaihtaa toiseen kokoon 14 päivän aikana. Ota kuitti mukaan. Tuotteessa pitää olla hintalappu paikallaan. Verkkokaupasta ostetun paidan voi vaihtaa myös tässä myymälässä. Jos oikeaa kokoa ei ole, myyjä tarkistaa toisen myymälän varaston. Tämä ohje koskee koon vaihtamista.", "questions": [{"t": "Voiko asiakas vaihtaa käytettyä paitaa?", "type": "open", "options": [], "answer": "Ei", "aliases": [], "explain": "Only unused shirts."}, {"t": "Mitkä kaksi asiaa tarvitaan paidan lisäksi?", "type": "open", "options": [], "answer": "Kuitti ja hintalappu", "aliases": [], "explain": "Receipt and attached price tag."}, {"t": "Mitä myyjä tekee, jos oikeaa kokoa ei ole?", "type": "open", "options": [], "answer": "Tarkistaa toisen myymälän varaston", "aliases": [], "explain": "Checks stock at another store."}], "source": "02_reading.pdf • source exercise"}, {"id": "X1", "unit": "Extra exam-style", "title": "Hospital message", "text": "TERVEYSASEMA\nAjanvaraus on avoinna arkisin kello 8–15. Vastaanotto keskiviikkona kello 11 on peruttu lääkärin sairastumisen vuoksi. Soita ja varaa uusi aika. Älä tule paikalle ilman uutta ajanvarausta.", "questions": [{"t": "Mikä tapaaminen on peruttu?", "type": "open", "options": [], "answer": "Keskiviikkona kello 11", "aliases": [], "explain": "Wednesday 11 appointment."}, {"t": "Miksi aika peruuntui?", "type": "open", "options": [], "answer": "Lääkäri on sairas", "aliases": [], "explain": "Doctor ill."}, {"t": "Voiko tulla ilman uutta aikaa?", "type": "tf", "options": [], "answer": "Väärin", "aliases": [], "explain": "New appointment required."}], "source": "New original transfer practice"}, {"id": "X2", "unit": "Extra exam-style", "title": "Library booking", "text": "KIRJASTON TYÖHUONE\nTyöhuoneen voi varata korkeintaan kahdeksi tunniksi. Varaus tehdään verkossa viimeistään edellisenä päivänä. Ruokaa ei saa syödä huoneessa. Juomapullo on sallittu.", "questions": [{"t": "Kuinka pitkä varaus voi olla?", "type": "open", "options": [], "answer": "Kaksi tuntia", "aliases": ["2 tuntia"], "explain": "Maximum two hours."}, {"t": "Milloin varaus pitää tehdä?", "type": "open", "options": [], "answer": "Edellisenä päivänä", "aliases": [], "explain": "No later than day before."}, {"t": "Huoneessa saa syödä ruokaa.", "type": "tf", "options": [], "answer": "Väärin", "aliases": [], "explain": "Eating prohibited."}], "source": "New original transfer practice"}, {"id": "X3", "unit": "Extra exam-style", "title": "Work shift exchange", "text": "TYÖVUOROVIESTI\nHei Arto, vaihdatko kanssani sunnuntain työvuoron? Olen silloin matkalla. Minä voin tehdä sinun keskiviikon aamuvuorosi. Kysy ensin esihenkilöltä lupa. Tarvitsemme vastauksen viimeistään torstaina.", "questions": [{"t": "Minkä päivän vuoro halutaan vaihtaa?", "type": "open", "options": [], "answer": "Sunnuntain", "aliases": [], "explain": "Sunday."}, {"t": "Kenen lupa tarvitaan?", "type": "open", "options": [], "answer": "Esihenkilön", "aliases": [], "explain": "Supervisor approval."}, {"t": "Mihin mennessä pitää vastata?", "type": "open", "options": [], "answer": "Torstaina", "aliases": [], "explain": "Deadline Thursday."}], "source": "New original transfer practice"}, {"id": "X4", "unit": "Extra exam-style", "title": "Bus service notice", "text": "BUSSILINJA 4\nLauantaina linja 4 kulkee poikkeusreittiä kello 12–18. Bussi ei pysähdy keskustan torilla, mutta pysähtyy kirjaston edessä. Arkisin reitti pysyy normaalina.", "questions": [{"t": "Milloin poikkeusreitti on käytössä?", "type": "open", "options": [], "answer": "Lauantaina kello 12–18", "aliases": [], "explain": "Saturday noon to six."}, {"t": "Pysähtyykö bussi torilla?", "type": "open", "options": [], "answer": "Ei", "aliases": [], "explain": "Not at market square."}, {"t": "Missä se pysähtyy?", "type": "open", "options": [], "answer": "Kirjaston edessä", "aliases": [], "explain": "In front of library."}], "source": "New original transfer practice"}, {"id": "X5", "unit": "Extra exam-style", "title": "School computer", "text": "TIETOKONEEN PÄIVITYS\nKoulun tietokoneet päivitetään maanantaina aamulla. Käyttäjät eivät voi kirjautua sisään kello 8–9. Tallenna työsi jo sunnuntai-iltana. Jos ongelma jatkuu yhdeksän jälkeen, kirjoita IT-tuelle.", "questions": [{"t": "Miksi kirjautuminen ei toimi?", "type": "open", "options": [], "answer": "Tietokoneet päivitetään", "aliases": [], "explain": "Software update."}, {"t": "Milloin kirjautuminen onnistuu normaalisti?", "type": "open", "options": [], "answer": "Kello 9 jälkeen", "aliases": [], "explain": "Service resumes after 9."}, {"t": "Kenelle ilmoitetaan ongelmasta?", "type": "open", "options": [], "answer": "IT-tuelle", "aliases": [], "explain": "IT support."}], "source": "New original transfer practice"}, {"id": "X6", "unit": "Extra exam-style", "title": "Course deadline", "text": "KURSSIN PALAUTUS\nProjektin ensimmäinen osa palautetaan perjantaina kello 16. Lopullinen raportti palautetaan viikon kuluttua seuraavana perjantaina. Opettaja tarkistaa ensimmäisen osan ennen lopullista raporttia.", "questions": [{"t": "Milloin ensimmäinen osa palautetaan?", "type": "open", "options": [], "answer": "Perjantaina kello 16", "aliases": [], "explain": "First deadline."}, {"t": "Milloin lopullinen raportti palautetaan?", "type": "open", "options": [], "answer": "Seuraavana perjantaina", "aliases": [], "explain": "One week later."}, {"t": "Mikä palautetaan ensin?", "type": "open", "options": [], "answer": "Projektin ensimmäinen osa", "aliases": [], "explain": "First part comes before final report."}], "source": "New original transfer practice"}, {"id": "X7", "unit": "Extra exam-style", "title": "Store hours", "text": "LÄHIKAUPAN AIKATAULU\nKauppa on avoinna ma–pe 7–22 ja lauantaina 8–21. Sunnuntaina kauppa avataan kello 10 ja suljetaan kello 18. Apteekki kaupan vieressä suljetaan sunnuntaina kello 16.", "questions": [{"t": "Milloin kauppa avataan sunnuntaina?", "type": "open", "options": [], "answer": "Kello 10", "aliases": [], "explain": "Shop opens at ten."}, {"t": "Mihin aikaan apteekki suljetaan sunnuntaina?", "type": "open", "options": [], "answer": "Kello 16", "aliases": [], "explain": "Pharmacy closes at 16."}, {"t": "Kauppa suljetaan sunnuntaina kello 21.", "type": "tf", "options": [], "answer": "Väärin", "aliases": [], "explain": "Sunday shop closes at 18."}], "source": "New original transfer practice"}, {"id": "X8", "unit": "Extra exam-style", "title": "Sports registration", "text": "KUNTOSALIN KURSSI\nJoogatunti järjestetään maanantaisin 17–18. Ensimmäinen tutustumiskerta on maksuton, sen jälkeen maksu on 8 euroa kerralta. Ota oma matto mukaan. Ilmoittautuminen tehdään verkkosivulla.", "questions": [{"t": "Milloin joogatunti alkaa?", "type": "open", "options": [], "answer": "Maanantaina kello 17", "aliases": [], "explain": "Monday 17:00."}, {"t": "Paljonko ensimmäinen tunti maksaa?", "type": "open", "options": [], "answer": "0 euroa", "aliases": ["maksuton"], "explain": "First session free."}, {"t": "Mitä pitää ottaa mukaan?", "type": "open", "options": [], "answer": "Oma matto", "aliases": [], "explain": "Bring a mat."}], "source": "New original transfer practice"}, {"id": "X9", "unit": "Extra exam-style", "title": "Package pickup", "text": "PAKETIN NOUTO\nPakettisi on noudettavissa postista keskiviikosta alkaen. Ota mukaan henkilöllisyystodistus ja noutokoodi. Paketti säilytetään seitsemän päivää. Sunnuntaina palvelupiste on suljettu.", "questions": [{"t": "Mistä paketti noudetaan?", "type": "open", "options": [], "answer": "Postista", "aliases": [], "explain": "From post office."}, {"t": "Mitkä kaksi asiaa tarvitaan?", "type": "open", "options": [], "answer": "Henkilöllisyystodistus ja noutokoodi", "aliases": [], "explain": "Both ID and pickup code."}, {"t": "Voiko paketin hakea sunnuntaina?", "type": "open", "options": [], "answer": "Ei", "aliases": [], "explain": "Counter closed Sunday."}], "source": "New original transfer practice"}, {"id": "X10", "unit": "Extra exam-style", "title": "Lost keys", "text": "KADONNEET AVAIMET\nLöysin avainnipun koulun pihalta tiistaina iltapäivällä. Avaimissa on sininen avaimenperä. Vein ne heti vastaanottoon. Kysy vastaanotosta ennen kello neljää, jos avaimet ovat sinun.", "questions": [{"t": "Mistä avaimet löytyivät?", "type": "open", "options": [], "answer": "Koulun pihalta", "aliases": [], "explain": "School courtyard."}, {"t": "Minkä värinen avaimenperä on?", "type": "open", "options": [], "answer": "Sininen", "aliases": [], "explain": "Blue."}, {"t": "Mistä avaimet voi kysyä?", "type": "open", "options": [], "answer": "Vastaanotosta", "aliases": [], "explain": "At reception."}], "source": "New original transfer practice"}, {"id": "X11", "unit": "Extra exam-style", "title": "Energy notice", "text": "SÄHKÖKATKO\nRakennuksessa on sähkökatko keskiviikkona kello 13–14. Hissit eivät ole käytössä katkon aikana. Käytä portaita. Tietokoneet pitää sammuttaa ennen kello yhtä.", "questions": [{"t": "Milloin sähkökatko alkaa?", "type": "open", "options": [], "answer": "Kello 13", "aliases": [], "explain": "Starts at 13."}, {"t": "Voiko hissiä käyttää?", "type": "open", "options": [], "answer": "Ei", "aliases": [], "explain": "Lifts unavailable."}, {"t": "Mitä tehdään tietokoneille etukäteen?", "type": "open", "options": [], "answer": "Sammutetaan", "aliases": [], "explain": "Shut computers down."}], "source": "New original transfer practice"}, {"id": "X12", "unit": "Extra exam-style", "title": "Neighbourhood event", "text": "KIELIKAHVILA\nKielikahvila on nuorisotalossa torstaisin kello 17–18.30. Tilaisuus on ilmainen aikuisille. Kahvi maksaa yhden euron. Ilmoittautumista ei tarvita. Tapaamisia ei ole syyslomaviikolla.", "questions": [{"t": "Kenelle tilaisuus on tarkoitettu?", "type": "open", "options": [], "answer": "Aikuisille", "aliases": [], "explain": "For adults."}, {"t": "Mitä osallistuminen maksaa?", "type": "open", "options": [], "answer": "0 euroa", "aliases": ["maksuton"], "explain": "Participating is free, coffee is not."}, {"t": "Tarvitseeko ilmoittautua?", "type": "open", "options": [], "answer": "Ei", "aliases": [], "explain": "No registration needed."}], "source": "New original transfer practice"}], "listening": [{"id": "L1", "title": "An appointment change", "unit": "An appointment change", "script": "Hei! Soitan hammashoitolasta. Sinulla oli aika tiistaina kello yhdeksän, mutta meidän täytyy siirtää sitä. Uusi aika on keskiviikkona kello puoli kymmenen. Vastaanotto on samassa paikassa kuin ennen. Jos uusi aika ei sovi sinulle, soita meille tänään ennen kello neljää. Kiitos!", "questions": [{"t": "Mille päivälle aika siirtyy?", "type": "open", "options": [], "answer": "Keskiviikolle", "aliases": ["keskiviikkona"], "explain": "The moved appointment is Wednesday."}, {"t": "Mihin aikaan uusi aika on?", "type": "mc", "options": ["9.00", "9.30", "10.30"], "answer": "B", "aliases": ["9.30"], "explain": "Puoli kymmenen = 09:30."}, {"t": "Mitä pitää tehdä, jos uusi aika ei sovi?", "type": "open", "options": [], "answer": "Soita tänään ennen kello 16", "aliases": ["soita ennen kello neljää"], "explain": "Call before 16:00 today."}], "source": "HAMK Finnish A2 Study Pack • Listening"}, {"id": "L2", "title": "At the railway station", "unit": "At the railway station", "script": "Huomio matkustajat. Juna Tampereelle on noin viisitoista minuuttia myöhässä. Juna lähtee tänään laiturilta neljä, ei laiturilta kaksi. Pahoittelemme viivästystä. Tarkista junan uusi lähtöaika aseman näytöltä.", "questions": [{"t": "Mihin kaupunkiin juna menee?", "type": "open", "options": [], "answer": "Tampereelle", "aliases": ["tampere"], "explain": "Destination Tampere."}, {"t": "Kuinka paljon juna on myöhässä?", "type": "open", "options": [], "answer": "15 minuuttia", "aliases": ["viisitoista minuuttia"], "explain": "Delay fifteen minutes."}, {"t": "Miltä laiturilta juna lähtee nyt?", "type": "open", "options": [], "answer": "Laiturilta neljä", "aliases": ["4"], "explain": "Not platform two."}], "source": "HAMK Finnish A2 Study Pack • Listening"}, {"id": "L3", "title": "A phone message", "unit": "A phone message", "script": "Moi! Voitko käydä kaupassa kotimatkalla? Tarvitsemme leipää ja kananmunia. Maitoa ei tarvitse ostaa, sitä on vielä jääkaapissa. Minä tulen kotiin noin kuudelta. Teen sitten meille ruokaa. Nähdään illalla!", "questions": [{"t": "Mitä ystävä pyytää ostamaan? Mainitse kaksi asiaa.", "type": "open", "options": [], "answer": "Leipää ja kananmunia", "aliases": ["leipää kananmunia"], "explain": "Both items needed."}, {"t": "Pitääkö ostaa maitoa?", "type": "tf", "options": [], "answer": "V", "aliases": ["väärin"], "explain": "Milk is already in the fridge."}, {"t": "Milloin ystävä tulee kotiin?", "type": "open", "options": [], "answer": "Kello 18", "aliases": ["kuudelta"], "explain": "Around six in the evening."}], "source": "HAMK Finnish A2 Study Pack • Listening"}, {"id": "L4", "title": "A lesson moves", "unit": "A lesson moves", "script": "Hyvää huomenta! Suomen tunti on tänään kirjaston toisessa kerroksessa. Tavallisessa luokassa tehdään remonttia. Tunti alkaa kymmeneltä kuten aina. Ota mukaan vihko ja kynä. Oppikirjaa ei tänään tarvita, koska opettaja antaa teille tekstit.", "questions": [{"t": "Missä tunti on tänään?", "type": "open", "options": [], "answer": "Kirjaston toisessa kerroksessa", "aliases": ["kirjastossa toisessa kerroksessa"], "explain": "Library second floor."}, {"t": "Miksi tavallista luokkaa ei käytetä?", "type": "open", "options": [], "answer": "Luokassa tehdään remonttia", "aliases": ["remontti"], "explain": "The ordinary classroom is under renovation."}, {"t": "Mihin aikaan tunti alkaa?", "type": "open", "options": [], "answer": "Kello 10", "aliases": ["10"], "explain": "The time remains ten."}], "source": "HAMK Finnish A2 Study Pack • Listening"}, {"id": "L5", "title": "A weekend plan", "unit": "A weekend plan", "script": "Hei Sami! Ajattelin, että voisimme mennä lauantaina museoon. Sääennusteen mukaan silloin sataa, joten puisto ei ehkä ole hyvä idea. Museo avautuu kahdeltatoista. Tavataanko sen ovella puoli yksi? Liput maksavat opiskelijoille viisi euroa. Ota opiskelijakortti mukaan.", "questions": [{"t": "Miksi puhuja ei halua mennä puistoon lauantaina?", "type": "open", "options": [], "answer": "Koska sataa", "aliases": ["sataa"], "explain": "Rain forecast, not temperature."}, {"t": "Mihin hän ehdottaa menemistä?", "type": "open", "options": [], "answer": "Museoon", "aliases": ["museo"], "explain": "Suggested museum."}, {"t": "Mikä tapaamisaika on?", "type": "mc", "options": ["12.30", "13.30", "14.30"], "answer": "A", "aliases": ["12.30"], "explain": "Puoli yksi = 12:30."}], "source": "HAMK Finnish A2 Study Pack • Listening"}, {"id": "L6", "title": "A short interview", "unit": "A short interview", "script": "Minä olen Aino. Olen töissä pienessä kahvilassa. Työpäiväni alkaa aamulla kahdeksalta ja loppuu iltapäivällä kolmelta. Tiistaisin ja torstaisin menen työn jälkeen suomen kurssille. Haluan oppia suomea, koska haluan puhua paremmin asiakkaiden kanssa. Viikonloppuna lepään ja tapaan ystäviä.", "questions": [{"t": "Missä Aino työskentelee?", "type": "open", "options": [], "answer": "Kahvilassa", "aliases": ["kahvila"], "explain": "Aino works in a café."}, {"t": "Milloin hän opiskelee suomea?", "type": "open", "options": [], "answer": "Tiistaisin ja torstaisin", "aliases": ["tiistai ja torstai"], "explain": "On Tuesdays and Thursdays after work."}, {"t": "Miksi hän haluaa oppia suomea?", "type": "open", "options": [], "answer": "Puhua asiakkaiden kanssa", "aliases": ["asiakkaiden kanssa"], "explain": "She wants to serve customers better."}], "source": "HAMK Finnish A2 Study Pack • Listening"}, {"id": "L7", "title": "The wrong purchase", "unit": "The wrong purchase", "script": "Hei! Ostin tämän paidan eilen, mutta se on liian pieni. Väri on hyvä, ja pidän tästä mallista. Haluaisin vaihtaa sen suurempaan kokoon. Minulla on kuitti mukana. Onko teillä samaa paitaa koossa L?", "questions": [{"t": "Mikä ongelma paidassa on?", "type": "open", "options": [], "answer": "Liian pieni", "aliases": ["pieni"], "explain": "The shirt is too small."}, {"t": "Milloin asiakas osti paidan?", "type": "open", "options": [], "answer": "Eilen", "aliases": ["yesterday"], "explain": "She bought it yesterday."}, {"t": "Mitä asiakas haluaa tehdä?", "type": "open", "options": [], "answer": "Vaihtaa suurempaan kokoon", "aliases": ["vaihtaa kokoon L"], "explain": "Exchange for a bigger shirt."}], "source": "HAMK Finnish A2 Study Pack • Listening"}, {"id": "L8", "title": "Weather", "unit": "Weather", "script": "Huomenna aamulla on aurinkoista ja melko viileää. Lämpötila on noin kahdeksan astetta. Iltapäivällä sää lämpenee, ja lämpötila nousee neljääntoista asteeseen. Sade alkaa vasta illalla. Jos lähdet illaksi ulos, ota sateenvarjo mukaan.", "questions": [{"t": "Millainen sää on aamulla?", "type": "open", "options": [], "answer": "Aurinkoista ja viileää", "aliases": ["aurinkoista"], "explain": "Sunny and cool."}, {"t": "Milloin sade alkaa?", "type": "open", "options": [], "answer": "Illalla", "aliases": ["ilta"], "explain": "Rain begins in evening."}, {"t": "Kuinka lämmintä iltapäivällä on?", "type": "open", "options": [], "answer": "14 astetta", "aliases": ["neljätoista astetta"], "explain": "About 14°C afternoon."}], "source": "HAMK Finnish A2 Study Pack • Listening"}, {"id": "L9", "title": "A café meeting in spoken Finnish", "unit": "A café meeting in spoken Finnish", "script": "Moi! Mä oon vähän myöhässä, koska bussi ei tullut ajoissa. Mä oon siellä noin kymmenen minuutin päästä. Sun ei tarvitse odottaa ulkona. Mene vaan sisälle kahvilaan ja ota pöytä. Mä tuun sinne heti, kun pääsen.", "questions": [{"t": "Miksi puhuja on myöhässä?", "type": "open", "options": [], "answer": "Bussi ei tullut ajoissa", "aliases": ["bussi myöhässä"], "explain": "Bus was late."}, {"t": "Kuinka kauan hänellä vielä kestää?", "type": "open", "options": [], "answer": "10 minuuttia", "aliases": ["kymmenen minuuttia"], "explain": "About ten more minutes."}, {"t": "Missä vastaanottaja voi odottaa?", "type": "open", "options": [], "answer": "Kahvilan sisällä", "aliases": ["kahvilassa"], "explain": "Wait inside the café."}], "source": "HAMK Finnish A2 Study Pack • Listening"}, {"id": "L10", "title": "Opening hours", "unit": "Opening hours", "script": "Tervetuloa opiskelijapalveluihin. Toimistomme on avoinna maanantaisin, keskiviikkoisin ja perjantaisin kello kymmenestä kahteen. Voit tulla ilman ajanvarausta. Muina päivinä voit lähettää meille sähköpostia. Vastaamme viesteihin yleensä kahden arkipäivän kuluessa.", "questions": [{"t": "Minä päivinä toimisto on avoinna?", "type": "open", "options": [], "answer": "Maanantai keskiviikko perjantai", "aliases": ["maanantaisin keskiviikkoisin perjantaisin"], "explain": "All three days."}, {"t": "Mihin aikaan toimisto aukeaa?", "type": "open", "options": [], "answer": "Kello 10", "aliases": ["10"], "explain": "Opens at 10."}, {"t": "Voiko toimistoon tulla ilman ajanvarausta?", "type": "tf", "options": [], "answer": "O", "aliases": ["oikein"], "explain": "Walk-in visits allowed."}], "source": "HAMK Finnish A2 Study Pack • Listening"}, {"id": "L11", "title": "A repair visit", "unit": "A repair visit", "script": "Hei, tässä on huoltomies. Tulen huomenna torstaina aamulla kahdeksan ja yhdeksän välillä korjaamaan keittiön hanaa. Työ kestää noin puoli tuntia. Jos et ole silloin kotona, soita minulle, niin sovimme toisen ajan. Kiitos ja huomiseen.", "questions": [{"t": "Milloin huoltomies tulee?", "type": "open", "options": [], "answer": "Torstaina kello 8–9", "aliases": ["huomenna torstaina"], "explain": "Tomorrow Thursday 08:00–09:00."}, {"t": "Mitä hän korjaa?", "type": "open", "options": [], "answer": "Keittiön hanaa", "aliases": ["hanaa"], "explain": "Kitchen tap."}, {"t": "Mitä asukkaan pitää tehdä, jos aika ei sovi?", "type": "open", "options": [], "answer": "Soittaa huoltomiehelle", "aliases": ["soittaa ja sopia toinen aika"], "explain": "Call to arrange another time."}], "source": "HAMK Finnish A2 Study Pack • Listening"}, {"id": "L12", "title": "Two plans and a change", "unit": "Two plans and a change", "script": "Meidän piti mennä tänään uimaan, mutta uimahalli on kiinni. Ajattelimme ensin mennä elokuviin. Liput olivat kuitenkin liian kalliita. Päätimme lopulta mennä ystävän kotiin ja tehdä ruokaa yhdessä. Menemme uimaan ensi viikolla.", "questions": [{"t": "Mihin puhujat aluksi aikoivat mennä?", "type": "open", "options": [], "answer": "Uimaan", "aliases": ["uinti"], "explain": "Originally swimming."}, {"t": "Miksi suunnitelma muuttui?", "type": "open", "options": [], "answer": "Uimahalli on kiinni", "aliases": ["uimahalli suljettu"], "explain": "Pool closed."}, {"t": "Mitä he tekevät lopulta?", "type": "open", "options": [], "answer": "Ystävän kotiin tekemään ruokaa", "aliases": ["tekevät ruokaa yhdessä"], "explain": "Ultimately cook at a friend’s home."}], "source": "HAMK Finnish A2 Study Pack • Listening"}], "writing": [{"id": "W1", "title": "Absence from class", "task": "Olet sairas. Kirjoita opettajalle viesti. Kerro, miksi olet poissa, kuinka kauan olet poissa ja kysy kotitehtävistä.", "model": "Hei! En pääse tänään suomen tunnille, koska olen sairas. Minulla on kuumetta ja päänsärkyä. Olen poissa tänään ja huomenna. Voisitko lähettää minulle kotitehtävät? Teen ne, kun voin paremmin. Kiitos avusta! Terveisin Islam", "check": "Illness explained; absence length given; homework requested. Change the illness and absence length, then write again without the model.", "source": "Study Pack • Writing"}, {"id": "W2", "title": "Cancel and rearrange a meeting", "task": "Et voi tavata ystävääsi tänään. Pyydä anteeksi, kerro syy ja ehdota uutta aikaa ja paikkaa.", "model": "Moi Sami! Anteeksi, en voi tulla tänään kahvilaan. Minun täytyy tehdä ryhmätyö valmiiksi. Voimmeko tavata huomenna kello viisi? Tavataan kirjaston edessä ja mennään sitten kahville. Kerro, sopiiko aika sinulle. Olisi mukava nähdä! Terveisin Islam", "check": "Apology, study reason, tomorrow at five, library entrance and confirmation question.", "source": "Study Pack • Writing"}, {"id": "W3", "title": "Invite someone", "task": "Kutsu ystävä kotiisi syömään. Kerro päivä, aika, osoite ja mitä teette. Kysy, voiko hän tulla.", "model": "Moi Sami! Haluaisin kutsua sinut meille syömään lauantaina kello kuusi. Osoite on Mallikatu 8, asunto 12. Teen riisiä ja kasvisruokaa. Voimme syödä ja katsoa sen jälkeen elokuvan. Pääsetkö tulemaan? Kerro myös, jos et voi syödä jotakin ruokaa. Nähdään! Islam", "check": "Saturday at six, address, meal and film, availability question. The address is fictional.", "source": "Study Pack • Writing"}, {"id": "W4", "title": "Ask about a course", "task": "Haluat suomen kurssille. Kerro kielitaidostasi. Kysy, milloin kurssi alkaa, mitä se maksaa ja miten ilmoittaudut.", "model": "Hei! Haluaisin tulla suomen kurssille. Osaan jo vähän suomea ja haluan harjoitella puhumista. Milloin seuraava kurssi alkaa? Kuinka paljon kurssi maksaa? Haluaisin myös tietää, miten voin ilmoittautua. Minulle sopivat parhaiten iltakurssit. Kiitos vastauksesta! Ystävällisin terveisin Islam", "check": "Current level, start date, cost and registration method are all included.", "source": "Study Pack • Writing"}, {"id": "W5", "title": "Report a broken appliance", "task": "Asuntosi jääkaappi ei toimi. Kirjoita huoltoon. Kerro ongelma, milloin huomasit sen, osoite ja milloin olet kotona.", "model": "Hei! Asun osoitteessa Mallikatu 8, asunto 12. Jääkaappi ei toimi. Huomasin ongelman tänä aamuna, ja jääkaappi on lämmin. Voitteko tulla korjaamaan sen mahdollisimman pian? Olen kotona tänään kello neljän jälkeen ja huomenna aamulla. Kiitos avusta! Terveisin Islam", "check": "Fault, discovery time, address, repair request and availability.", "source": "Study Pack • Writing"}, {"id": "W6", "title": "A lost bag", "task": "Unohdit laukun bussiin. Kerro milloin ja missä, kuvaile laukku ja kysy, onko se löytynyt.", "model": "Hei! Unohdin laukkuni bussiin numero 12 eilen noin kello neljä. Jäin pois keskustan pysäkillä. Laukku on pieni ja musta. Sen sisällä on kirja ja vesipullo. Onko laukku löytynyt? Voitteko vastata tähän viestiin, jos löydätte sen? Kiitos avusta! Terveisin Islam", "check": "Bus and time, stop, appearance, contents and contact method.", "source": "Study Pack • Writing"}, {"id": "W7", "title": "Complain about a product", "task": "Ostit kuulokkeet, mutta ne eivät toimi. Kerro ostoaika, ongelma ja toivomasi ratkaisu.", "model": "Hei! Ostin kaupasta kuulokkeet maanantaina. Ne eivät toimi kunnolla. Vasemmalta puolelta ei kuulu ääntä. Kokeilin kuulokkeita myös toisella puhelimella, mutta ongelma on sama. Minulla on kuitti. Haluaisin vaihtaa ne toimiviin kuulokkeisiin. Miten voin hoitaa asian? Ystävällisin terveisin Islam", "check": "Purchase date, specific fault, attempted check, receipt and requested replacement.", "source": "Study Pack • Writing"}, {"id": "W8", "title": "Describe your neighbourhood to a friend", "task": "Ystäväsi etsii asuntoa. Kerro alueesi palveluista, liikkumisesta ja yhdestä huonosta puolesta.", "model": "Moi Sami! Minun alueellani on mukava asua. Lähellä on ruokakauppa, kirjasto ja puisto. Bussipysäkki on aivan talon vieressä, joten keskustaan on helppo mennä. Käyn usein kävelyllä puistossa. Huono puoli on se, että vuokrat ovat melko kalliita. Tule joskus katsomaan aluetta! Terveisin Islam", "check": "Services, transport and high rent as a disadvantage.", "source": "Study Pack • Writing"}, {"id": "W9", "title": "Give feedback about a shop", "task": "Kerro kolme hyvää ja kolme huonoa asiaa lähikaupasta. Selitä miksi ja ehdota yhtä parannusta.", "model": "Lähikaupassani on paljon hyvää. Se on lähellä kotia, joten voin kävellä sinne. Myyjät ovat ystävällisiä ja auttavat minua. Kauppa on myös siisti, joten siellä on mukava käydä. Joissakin asioissa on ongelmia. Hinnat ovat korkeita, joten ostokset maksavat paljon. Illalla on pitkät jonot, ja joudun odottamaan. Leipää on joskus liian vähän, joten en löydä haluamaani tuotetta. Toivon, että illalla olisi enemmän kassoja auki. Kiitos hyvästä palvelusta!", "check": "Good: location, helpful staff, cleanliness. Bad: prices, queues, bread availability. Each has an effect or reason. Suggested improvement: more evening checkouts. This is an original response to the broad feedback task type shown on the YKI page.", "source": "Study Pack • Writing"}, {"id": "W10", "title": "Describe a past day", "task": "Kerro viime sunnuntaista. Mitä teit aamulla, päivällä ja illalla? Millainen päivä oli?", "model": "Viime sunnuntai oli rauhallinen. Heräsin kello yhdeksän ja söin aamupalaa. Aamulla siivosin keittiön. Päivällä menin ystävän kanssa puistoon. Kävelimme tunnin ja joimme kahvia. Illalla olin kotona. Tein ruokaa ja opiskelin vähän suomea. Menin aikaisin nukkumaan. Päivä oli mukava, koska minulla ei ollut kiire.", "check": "Morning, daytime and evening activities, past tense and an overall comment with a reason.", "source": "Study Pack • Writing"}, {"id": "W11", "title": "Give an opinion about language learning", "task": "Onko suomen opiskelu tärkeää? Kerro mielipiteesi, kaksi syytä ja oma esimerkki.", "model": "Minusta suomen opiskelu on tärkeää. Ensiksi arjen asiat ovat helpompia, kun ymmärtää suomea. Esimerkiksi kaupassa voi kysyä apua. Toiseksi suomen taito voi auttaa työssä, koska monet asiakkaat puhuvat suomea. Itse harjoittelen joka päivä vähän. Eilen kysyin kaupassa tuotteen hintaa suomeksi. Olin iloinen, koska ymmärsin vastauksen. Haluan jatkaa harjoittelua.", "check": "Opinion, two reasons, personal example. You can write a different opinion if it is relevant and explained.", "source": "Study Pack • Writing"}, {"id": "W12", "title": "Ask for extra time", "task": "Et ehdi palauttaa tehtävää ajoissa. Kirjoita opettajalle, selitä miksi ja ehdota uutta palautuspäivää.", "model": "Hei! En ehdi palauttaa tehtävää tänään, koska tietokoneeni meni rikki eilen. Olen tehnyt jo osan tehtävästä, mutta tarvitsen vielä aikaa. Voinko palauttaa sen perjantaina? Käytän huomenna kirjaston tietokonetta ja jatkan työtä siellä. Anteeksi myöhästyminen. Kiitos ymmärryksestä! Terveisin Islam", "check": "Reason, proposed deadline, practical plan and apology.", "source": "Study Pack • Writing"}], "speaking": [{"id": "S1", "title": "Introduce yourself", "prompt": "Kerro itsestäsi. — Introduce yourself: name, origin, home, studies and interests.", "model": "Hei! Minun nimeni on Islam. Olen kotoisin Bangladeshista. Asun Suomessa. Opiskelen tietotekniikkaa HAMKissa. Puhun bengalia, englantia ja vähän suomea. Vapaa-ajalla kuuntelen musiikkia ja kävelen. Haluan oppia suomea, koska haluan käyttää sitä arjessa ja työssä.", "meaning": "Hello, my name is Islam. I am from Bangladesh and live in Finland. I study ICT at HAMK. I speak Bengali, English and some Finnish. I listen to music and walk in my free time. I want to learn Finnish for everyday life and work.", "followups": "Mitä opiskelet? — Opiskelen tietotekniikkaa. Miksi valitsit tämän alan? — Koska pidän tietokoneista ja haluan oppia uusia asioita. Change practice: Add your actual town, age and length of residence. Do not memorize an invented age or arrival date.", "source": "Study Pack • Speaking"}, {"id": "S2", "title": "Family", "prompt": "Kerro perheestäsi. Keitä perheeseesi kuuluu? — Describe your family and who is in it.", "model": "Perheeni on minulle tärkeä. Perheeseeni kuuluvat vanhempani ja siskoni. Vanhempani asuvat Bangladeshissa. Soitan heille usein illalla. Puhumme päivän asioista. Kun olemme yhdessä, laitamme ruokaa ja syömme yhdessä. Ikävöin perhettäni, koska asumme kaukana toisistamme.", "meaning": "My family is important to me. It includes my parents and sister. My parents live in Bangladesh. I call them often in the evening. We talk about our day. We cook and eat together when we meet. I miss my family because we live far apart.", "followups": "Kuinka usein soitat perheellesi? — Soitan kolme kertaa viikossa. Onko sinulla lapsia? — Minulla ei ole lapsia. / Minulla on yksi lapsi. Change practice: Replace the family members with your real family. You can say Asun yksin or Asun puolisoni kanssa if appropriate.", "source": "Study Pack • Speaking"}, {"id": "S3", "title": "A good friend", "prompt": "Millainen on hyvä ystävä? Kerro ystävästäsi. — What is a good friend like? Describe a friend.", "model": "Hyvä ystävä on ystävällinen ja rehellinen. Hän kuuntelee ja auttaa. Minulla on hyvä ystävä, jonka nimi on Sami. Tapasimme koulussa. Hän on rauhallinen ja hauska. Käymme joskus kahvilla ja puhumme opinnoista. Pidän hänestä, koska hänen kanssaan on helppo puhua.", "meaning": "A good friend is kind and honest, listens and helps. My friend Sami and I met at school. He is calm and funny. We sometimes have coffee and talk about studies. He is easy to talk to.", "followups": "Mitä teitte viimeksi yhdessä? — Kävimme kahvilassa viime lauantaina. Miten autat ystävää? — Kuuntelen häntä ja autan tehtävissä.", "source": "Study Pack • Speaking"}, {"id": "S4", "title": "Home", "prompt": "Millaisessa asunnossa asut? — Describe your home.", "model": "Asun pienessä kerrostaloasunnossa. Asunnossa on olohuone, makuuhuone, keittiö ja kylpyhuone. Olohuoneessa on sohva ja pöytä. Pidän kodistani, koska se on valoisa ja rauhallinen. Kauppa ja bussipysäkki ovat lähellä. Vuokra on melko kallis. Haluaisin joskus asunnon, jossa on parveke.", "meaning": "I live in a small apartment with a living room, bedroom, kitchen and bathroom. It has a sofa and table. I like its light and quietness. Shops and transport are nearby, but the rent is fairly expensive. I would like a balcony in a future home.", "followups": "Mikä on kodin paras paikka? — Olohuone, koska voin levätä siellä. Mitä haluaisit muuttaa? — Haluaisin enemmän tilaa.", "source": "Study Pack • Speaking"}, {"id": "S5", "title": "Your local area", "prompt": "Kerro asuinalueestasi. — Describe your neighbourhood.", "model": "Asuinalueeni on rauhallinen. Lähellä on kauppa, kirjasto ja puisto. Menen usein puistoon kävelemään. Bussilla pääsee keskustaan. Pidän alueesta, koska palvelut ovat lähellä. Illalla kadulla on joskus melua. Haluaisin alueelle lisää pyöräteitä.", "meaning": "My area is quiet with a shop, library and park nearby. I walk in the park and can take a bus to the centre. Services are convenient. There is occasional evening noise, and I would like more cycle paths.", "followups": "Onko siellä hyvä asua? — Kyllä, koska siellä on turvallista ja palvelut ovat lähellä. Miten menet keskustaan? — Menen bussilla.", "source": "Study Pack • Speaking"}, {"id": "S6", "title": "A normal weekday", "prompt": "Mitä teet tavallisena arkipäivänä? — Describe a normal weekday.", "model": "Herään yleensä kello seitsemän. Ensin pesen hampaat ja syön aamupalaa. Sitten lähden kouluun. Opiskelen aamulla ja iltapäivällä. Syön lounasta koulun ravintolassa. Koulun jälkeen teen tehtäviä kotona. Illalla laitan ruokaa ja kävelen vähän. Menen nukkumaan noin kello yksitoista.", "meaning": "I wake at seven, wash my teeth, eat breakfast and go to school. I study during the day and eat lunch at school. Afterwards I do assignments, cook, walk and go to bed around eleven.", "followups": "Mihin aikaan heräät viikonloppuna? — Herään yleensä yhdeksältä. Mitä teet koulun jälkeen? — Teen tehtäviä ja lepään.", "source": "Study Pack • Speaking"}, {"id": "S7", "title": "Yesterday or last weekend", "prompt": "Mitä teit viime viikonloppuna? — What did you do last weekend?", "model": "Viime lauantaina heräsin melko myöhään. Söin aamupalaa ja siivosin asunnon. Sen jälkeen kävin kaupassa. Iltapäivällä tapasin ystävän kahvilassa. Puhuimme ja joimme teetä. Sunnuntaina opiskelin suomea kotona. En mennyt ulos, koska satoi. Viikonloppu oli rauhallinen.", "meaning": "I woke late on Saturday, ate, cleaned and shopped. I met a friend for tea. On Sunday I studied Finnish at home and stayed inside because it rained. It was a quiet weekend.", "followups": "Kenen kanssa olit? — Olin ystäväni kanssa. Millainen sää oli? — Lauantaina oli aurinkoista, mutta sunnuntaina satoi.", "source": "Study Pack • Speaking"}, {"id": "S8", "title": "Studies at HAMK", "prompt": "Kerro opinnoistasi. — Describe your studies.", "model": "Opiskelen tietotekniikkaa HAMKissa. Opiskelen esimerkiksi ohjelmointia ja tietoverkkoja. Käytän tietokonetta joka päivä. Teemme tehtäviä yksin ja ryhmässä. Pidän ryhmätöistä, koska voin oppia muilta. Joskus tehtävät ovat vaikeita. Silloin kysyn opettajalta apua. Tulevaisuudessa haluan työskennellä IT-alalla.", "meaning": "I study ICT, including programming and networks, at HAMK. I use a computer daily and work independently and in groups. I learn from other people. I ask the teacher for help when work is difficult and hope to work in IT.", "followups": "Mikä on vaikeaa? — Uudet sanat ja jotkut tehtävät ovat vaikeita. Miten opiskelet kotona? — Luen ohjeet ja teen harjoituksia.", "source": "Study Pack • Speaking"}, {"id": "S9", "title": "Work and practical training", "prompt": "Millaista työtä haluaisit tehdä? — What work would you like to do?", "model": "Haluaisin työskennellä IT-tuessa. Pidän tietokoneista ja ihmisten auttamisesta. Osaan käyttää tavallisia tietokoneohjelmia. Haluan oppia lisää työssä. Etsin harjoittelupaikkaa. Hyvässä työpaikassa on mukavat työkaverit ja selkeät ohjeet. Suomen kieli on tärkeä, koska asiakkaat voivat puhua suomea.", "meaning": "I would like to work in IT support. I like computers and helping people, can use ordinary programs and want to learn through practical training. Clear instructions and kind colleagues matter. Finnish helps when customers speak it.", "followups": "Mitä osaat tehdä? — Osaan käyttää tietokonetta ja auttaa tavallisissa ongelmissa. Oletko nyt töissä? — Olen nyt opiskelija. / Olen töissä osa-aikaisesti.", "source": "Study Pack • Speaking"}, {"id": "S10", "title": "Learning Finnish", "prompt": "Miten opiskelet suomea? — How do you study Finnish?", "model": "Opiskelen suomea joka päivä. Luen lyhyitä tekstejä ja kirjoitan uusia sanoja vihkoon. Kuuntelen suomea ja toistan lauseita ääneen. Puhun suomea kaupassa, kun voin. Puhuminen on joskus vaikeaa, koska en muista kaikkia sanoja. Yritän kuitenkin puhua rauhallisesti. Haluan ymmärtää ihmisiä paremmin.", "meaning": "I study daily by reading, writing vocabulary, listening and repeating sentences. I practise in shops. Speaking is sometimes hard because I forget words, but I keep speaking calmly. I want to understand people better.", "followups": "Mikä auttaa sinua oppimaan? — Toistaminen ja lyhyet harjoitukset auttavat. Miksi tarvitset suomea? — Tarvitsen sitä arjessa, opinnoissa ja työssä.", "source": "Study Pack • Speaking"}, {"id": "S11", "title": "Food and cooking", "prompt": "Millaisesta ruoasta pidät? — What food do you like?", "model": "Pidän riisistä, kanasta ja vihanneksista. Teen usein ruokaa kotona, koska se on halvempi vaihtoehto. Syön aamulla leipää ja kananmunan. Päivällä syön lounasta koulussa. Illalla teen lämpimän ruoan. Viikonloppuna kokeilen joskus uutta reseptiä. Minusta yhdessä syöminen on mukavaa.", "meaning": "I like rice, chicken and vegetables. Cooking at home is cheaper. I eat bread and an egg for breakfast, lunch at school and a warm evening meal. I sometimes try a new recipe and enjoy eating with others.", "followups": "Osaatko laittaa ruokaa? — Kyllä, osaan tehdä muutamia ruokia. Kuinka usein käyt ravintolassa? — Käyn ravintolassa noin kerran kuukaudessa.", "source": "Study Pack • Speaking"}, {"id": "S12", "title": "Shopping and clothes", "prompt": "Miten ostat ruokaa tai vaatteita? — How do you shop for food or clothes?", "model": "Käyn ruokakaupassa yleensä kaksi kertaa viikossa. Teen ensin ostoslistan. Vertaan hintoja ja ostan usein tarjoustuotteita. Maksan yleensä kortilla. Vaatteita ostan harvemmin. Haluan, että vaatteet ovat mukavat ja sopivan kokoiset. Jos tuote on rikki, otan yhteyttä kauppaan.", "meaning": "I shop for food twice a week, make a list, compare prices and often buy special offers. I pay by card. I buy clothes less often and choose comfort and a good fit. I contact the shop about broken goods.", "followups": "Ostatko verkosta? — Joskus, mutta haluan yleensä nähdä tuotteen ensin. Millaisia vaatteita käytät talvella? — Käytän lämmintä takkia, pipoa ja hanskoja.", "source": "Study Pack • Speaking"}, {"id": "S13", "title": "Free time and exercise", "prompt": "Kerro harrastuksestasi. — Describe a hobby.", "model": "Harrastan kävelyä. Kävelen yleensä puistossa lähellä kotia. Menen ulos kolme tai neljä kertaa viikossa. Joskus ystävä tulee mukaan. Pidän kävelystä, koska se on helppoa eikä maksa mitään. Kävelyn jälkeen minulla on hyvä olo. Talvella käytän lämpimiä vaatteita.", "meaning": "Walking is my hobby. I go to a local park three or four times a week, sometimes with a friend. It is easy and free, makes me feel good and requires warm clothes in winter.", "followups": "Kuinka kauan kävelet? — Kävelen yleensä puoli tuntia. Haluaisitko aloittaa uuden harrastuksen? — Haluaisin aloittaa uinnin.", "source": "Study Pack • Speaking"}, {"id": "S14", "title": "Health and a recent illness", "prompt": "Miten pidät huolta itsestäsi? Milloin olit viimeksi sairas? — How do you look after yourself? When were you last ill?", "model": "Yritän nukkua tarpeeksi ja syödä säännöllisesti. Kävelen usein ja pidän taukoja opiskelusta. Viime kuussa olin sairas. Minulla oli kuumetta ja kurkku kipeä. Olin kotona kaksi päivää ja lepäsin. Ilmoitin opettajalle, että en pääse tunnille. Nyt voin hyvin.", "meaning": "I try to sleep enough, eat regularly, walk and take study breaks. Last month I had a fever and sore throat, stayed home for two days and informed the teacher. I am well now.", "followups": "Mitä sanot ajanvarauksessa? — Haluaisin varata ajan lääkärille. Mitä teit, kun olit sairaana? — Lepäsin kotona.", "source": "Study Pack • Speaking"}, {"id": "S15", "title": "Travel and holidays", "prompt": "Kerro lomamatkasta tai suunnittele matka. — Describe or plan a holiday.", "model": "Haluaisin matkustaa kesällä Tampereelle. Menen sinne junalla ystävän kanssa. Haluamme olla siellä kaksi päivää. Käymme museossa ja kävelemme keskustassa. Yövymme hotellissa. Etsin ensin sopivat liput ja vertaan hintoja. Pidän lyhyistä matkoista, koska ne on helppo suunnitella.", "meaning": "I would like a two-day summer trip to Tampere by train with a friend. We would visit a museum, walk in the centre and stay in a hotel. I would compare ticket prices. Short trips are easy to plan.", "followups": "Miksi matkustat junalla? — Koska junassa voi levätä. Mitä otat mukaan? — Otan vaatteita, puhelimen ja laturin.", "source": "Study Pack • Speaking"}, {"id": "S16", "title": "Weather and seasons", "prompt": "Mikä vuodenaika on paras? — Which season is best?", "model": "Pidän eniten kesästä. Kesällä on lämmintä ja valoisaa. Voin kävellä ja viettää aikaa ulkona. Pidän myös keväästä, koska päivät ovat pidempiä. Talvella on joskus liian kylmä. Silloin pukeudun lämpimästi. Tänään on pilvistä, mutta ei sada.", "meaning": "I like summer best because it is warm and light. I can spend time outdoors. I also enjoy longer spring days. Winter can be too cold, so I dress warmly. Today is cloudy but dry.", "followups": "Mitä teet, jos sataa? — Olen kotona tai menen kirjastoon. Millainen sää kotimaassasi on? — Siellä on usein lämmintä.", "source": "Study Pack • Speaking"}, {"id": "S17", "title": "Nature and recycling", "prompt": "Mitä teet luonnossa? Miten kierrätät? — What do you do in nature? How do you recycle?", "model": "Pidän luonnosta, koska siellä on rauhallista. Kävelen metsässä ja istun joskus järven lähellä. En jätä roskia luontoon. Kotona lajittelen paperin, kartongin ja biojätteen. Palautan tyhjät pullot kauppaan. Minusta pienet teot ovat tärkeitä. Jokainen voi pitää oman ympäristön siistinä.", "meaning": "Nature is peaceful. I walk in forests and sit near a lake without leaving rubbish. I sort household waste and return bottles. Small actions help keep our surroundings clean.", "followups": "Mihin laitat tyhjät pullot? — Palautan ne kaupan automaattiin. Miksi pidät metsästä? — Koska siellä on hiljaista.", "source": "Study Pack • Speaking"}, {"id": "S18", "title": "Phone and internet", "prompt": "Mihin käytät puhelinta? — What do you use your phone for?", "model": "Käytän puhelinta joka päivä. Lähetän viestejä ja soitan perheelle. Katson myös aikatauluja ja luen uutisia. Puhelin on hyödyllinen, koska voin hoitaa asioita nopeasti. Joskus käytän sitä liian paljon. Siksi laitan puhelimen pois, kun opiskelen. En halua katsoa näyttöä koko iltaa.", "meaning": "I use my phone for messages, family calls, timetables and news. It is useful but can take too much time, so I put it away while studying.", "followups": "Mitä teet, jos netti ei toimi? — Tarkistan yhteyden ja kysyn apua. Onko puhelin tärkeä? — On, mutta en tarvitse sitä koko ajan.", "source": "Study Pack • Speaking"}, {"id": "S19", "title": "Celebration and culture", "prompt": "Kerro juhlapäivästä tai tapahtumasta. — Describe a celebration or event.", "model": "Vietin viime vuonna syntymäpäivää kotona. Kutsuin muutaman ystävän kylään. Teimme ruokaa ja söimme kakkua. Kuuntelimme musiikkia ja puhuimme paljon. Juhlat olivat pienet, mutta mukavat. Minusta tärkeintä oli olla yhdessä. En tarvinnut kallista juhlaa.", "meaning": "Last year I celebrated a birthday at home with a few friends, food, cake, music and conversation. Togetherness mattered more than an expensive celebration.", "followups": "Mitä tarjoat vieraille? — Tarjoan ruokaa, teetä ja kakkua. Millaisista tapahtumista pidät? — Pidän pienistä konserteista.", "source": "Study Pack • Speaking"}, {"id": "S20", "title": "Future and life in Finland", "prompt": "Mitä haluat tehdä tulevaisuudessa? — What do you want to do in the future?", "model": "Haluan ensin valmistua. Sen jälkeen haluaisin löytää työpaikan Suomessa. Haluan myös puhua suomea paremmin. Harjoittelen vähän joka päivä. Suomessa pidän luonnosta ja rauhallisesta arjesta. Talven pimeys on joskus vaikeaa. Tulevaisuudessa haluan hyvän työn ja tavallisen, mukavan arjen.", "meaning": "I want to graduate, find work in Finland and improve my Finnish through daily practice. I enjoy nature and a peaceful life, although winter darkness can be hard. I want good work and a comfortable everyday life.", "followups": "Mitä teet tavoitteen eteen? — Opiskelen ja etsin harjoittelupaikkaa. Missä haluaisit asua? — Haluaisin asua lähellä työpaikkaa.", "source": "Study Pack • Speaking"}], "vocabulary": [{"fi": "nimi", "en": "name", "group": "People and personal details"}, {"fi": "etunimi", "en": "first name", "group": "People and personal details"}, {"fi": "sukunimi", "en": "family name", "group": "People and personal details"}, {"fi": "ikä", "en": "age", "group": "People and personal details"}, {"fi": "osoite", "en": "address", "group": "People and personal details"}, {"fi": "puhelinnumero", "en": "phone number", "group": "People and personal details"}, {"fi": "sähköposti", "en": "email", "group": "People and personal details"}, {"fi": "kotimaa", "en": "home country", "group": "People and personal details"}, {"fi": "äidinkieli", "en": "native language", "group": "People and personal details"}, {"fi": "kansalaisuus", "en": "nationality", "group": "People and personal details"}, {"fi": "perhe", "en": "family", "group": "People and personal details"}, {"fi": "vanhemmat", "en": "parents", "group": "People and personal details"}, {"fi": "äiti", "en": "mother", "group": "People and personal details"}, {"fi": "isä", "en": "father", "group": "People and personal details"}, {"fi": "lapsi", "en": "child", "group": "People and personal details"}, {"fi": "veli", "en": "brother", "group": "People and personal details"}, {"fi": "sisko", "en": "sister", "group": "People and personal details"}, {"fi": "puoliso", "en": "spouse", "group": "People and personal details"}, {"fi": "ystävä", "en": "friend", "group": "People and personal details"}, {"fi": "naapuri", "en": "neighbour.", "group": "People and personal details"}, {"fi": "koti", "en": "home", "group": "Home and housing"}, {"
